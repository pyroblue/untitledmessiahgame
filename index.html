<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untitled Messiah Game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e2b44a'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23fff6e4'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #241610;
    color: #f6ead8;
    font-family: "Avenir Next", Avenir, "Trebuchet MS", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    user-select: none;
    -webkit-user-select: none;
  }
  .stage {
    position: relative;
    width: min(100vw, calc((100dvh - 44px) * 960 / 600));
    max-height: calc(100dvh - 44px);
    aspect-ratio: 960 / 600;
    border-radius: 4px;
    box-shadow: 0 16px 50px rgba(0, 0, 0, 0.35);
    touch-action: none;
  }
  .stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 4px;
  }
  #view {
    background: #6e3028;
    cursor: default;
    touch-action: none;
  }
  #view:focus {
    outline: none;
  }
  #hud {
    pointer-events: none;
    background: transparent;
  }
  .hint {
    margin: 0;
    padding: 0 16px;
    font-size: clamp(11px, 1.4vw, 14px);
    font-weight: 600;
    letter-spacing: 0.06em;
    text-align: center;
    color: #f0e2cc;
  }
  .mobile-controls,
  .mobile-hint {
    display: none;
  }
  @media (hover: none) and (pointer: coarse) {
    .stage {
      --control-size: clamp(82px, 18vw, 112px);
      width: min(calc(100vw - 12px), calc((100dvh - var(--control-size) - 58px) * 960 / 600));
      max-height: calc(100dvh - var(--control-size) - 58px);
      margin-bottom: calc(var(--control-size) + 10px);
    }
    .mobile-controls {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      left: 0;
      height: var(--control-size);
      z-index: 3;
      display: block;
      pointer-events: none;
    }
    .joystick,
    .flip-control {
      position: absolute;
      top: 0;
      pointer-events: auto;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .joystick {
      left: clamp(8px, 3vw, 20px);
      width: var(--control-size);
      aspect-ratio: 1;
      border: 3px solid rgba(255, 235, 177, 0.72);
      border-radius: 50%;
      background: rgba(35, 18, 12, 0.7);
      box-shadow: 0 0 22px rgba(226, 180, 74, 0.32), inset 0 0 24px rgba(0, 0, 0, 0.42);
    }
    .joystick::before,
    .joystick::after {
      content: "";
      position: absolute;
      background: rgba(255, 235, 177, 0.2);
    }
    .joystick::before {
      left: 50%;
      top: 13%;
      width: 1px;
      height: 74%;
    }
    .joystick::after {
      left: 13%;
      top: 50%;
      width: 74%;
      height: 1px;
    }
    .joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: linear-gradient(#f7db80, #c9952c);
      border: 2px solid #fff1bd;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.5), 0 0 16px rgba(255, 216, 89, 0.45);
      transform: translate(-50%, -50%);
    }
    .flip-control {
      right: clamp(8px, 3vw, 20px);
      width: var(--control-size);
      aspect-ratio: 1;
      border: 3px solid #fff1bd;
      border-radius: 50%;
      background: linear-gradient(#efc85c, #bd7525);
      color: #2b160e;
      box-shadow: 0 7px 0 #714018, 0 0 24px rgba(255, 211, 78, 0.44);
      font: 800 clamp(16px, 4vw, 22px) "Avenir Next", Avenir, sans-serif;
      letter-spacing: 0.08em;
    }
    .flip-control:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #714018, 0 0 28px rgba(255, 222, 101, 0.65);
    }
    .desktop-hint {
      display: none;
    }
    .mobile-hint {
      display: inline;
    }
  }
  @media (hover: none) and (pointer: coarse) and (orientation: landscape) {
    .stage {
      width: min(calc(100vw - var(--control-size) - var(--control-size) - 36px), calc((100dvh - 44px) * 960 / 600));
      max-height: calc(100dvh - 44px);
      margin-bottom: 0;
    }
    .mobile-controls {
      inset: 0;
      height: auto;
    }
    .joystick,
    .flip-control {
      top: 50%;
      transform: translateY(-50%);
    }
    .joystick {
      right: calc(100% + 14px);
      left: auto;
    }
    .flip-control {
      right: auto;
      left: calc(100% + 14px);
    }
    .flip-control:active {
      transform: translateY(calc(-50% + 5px));
    }
  }
</style>

<body>
<div class="stage">
  <canvas id="view" width="960" height="600" tabindex="0" aria-label="Untitled Messiah Game. Flip every table before time runs out."></canvas>

</div>
<p class="hint"><span class="desktop-hint">WASD / arrows to waddle · Space or E to flip</span><span class="mobile-hint">Drag the stick to waddle · FLIP a nearby table</span></p>
<script>
/** Logical width of the court, in pixels. */
const W = 960;
/** Logical height of the court, in pixels. */
const H = 600;
/** Walkable floor. Feet are clamped to this rectangle. */
const FLOOR = { l: 70, t: 110, r: 890, b: 550 };
/** Visible width added to the temple on every new wave. */
const COURT_GROW_X = 140;
/** Visible depth added to the temple on every new wave. */
const COURT_GROW_Z = 110;
/** Starting clock, in seconds. */
const CLOCK = 70;
/** Seconds added when a wave is cleared. */
const BONUS = 2;
/** Seconds immediately earned by overturning a new table. */
const FLIP_TIME_BONUS = 0.6;
/** Player speed, in pixels per second. */
const SPEED = 260;
/** Player speed after collecting the sneaker. */
const BOOST_SPEED = 425;
/** Duration of the sneaker reward callout. */
const SPEED_FLASH_TIME = 1.8;
/** Keyboard flip range from the player, in pixels. */
const KEY_RANGE = 78;
/** Minimum distance between table anchors. */
const SEP = 110;
/** Preferred distance from the player when spawning a table. */
const CLEARANCE = 120;
/** Hard minimum so a table never overlaps the player. */
const BODY_GAP = 64;
/** How far a body stands out from its center when it bumps a table. */
const BODY = 14;
/** A table this far above the floor can be walked under. */
const TABLE_CLEAR = 30;

const MERCHANT_R = 90;
/** How long a wave banner stays up, in seconds. */
const BANNER_TIME = 2.2;
/** Flips are ignored while the banner timer is above this. */
const FLIP_LOCK = 1.35;
/** Length of the table-fall animation, in seconds. */
const FLIP_ANIM = 0.4;
/** How long the player's arms stay in the table-flip follow-through. */
const SWING_TIME = 0.5;
/** localStorage key for the best score. */
const BEST_KEY = 'umg-best';
/** Clean interface face shared by copy, labels, and numbers. */
const FONT = '"Avenir Next", Avenir, "Trebuchet MS", sans-serif';
/** Papyrus is reserved for the game title and dramatic story headlines. */
const HEAD = 'Papyrus, fantasy';
/** Heavy interface face for scores and callouts. */
const NUM = '"Avenir Next", Avenir, "Trebuchet MS", sans-serif';
/** Tablecloth colors. */
const CLOTHS = ['#c4503c', '#e6d3b0', '#8d3a48', '#d08a3a'];
/** Vertical field of view, in radians. Wide enough to see the court past the shoulder. */
const CAM_FOV = 0.78;
/** How far behind the player the camera sits. */
const CAM_BACK = 210;
/** Camera height above the floor. Just over the halo. */
const CAM_HEIGHT = 102;
/** Shift onto the right shoulder so the court stays visible ahead. */
const CAM_SHOULDER = 108;
/** How far ahead of the player the camera looks. */
const CAM_AHEAD = 260;
/** Height of the point the camera looks at. Kept near the shoulders so the body stays in frame. */
const CAM_LOOK_H = 42;
/** Smoothed yaw the over-the-shoulder camera is currently using. */
let camYaw = Math.PI;
/** Smoothed spot the camera rig follows, so starts and stops ease. */
let camX = 480;
let camZ = 460;
/** How fast the rig catches the player, and how fast yaw settles. */
const CAM_FOLLOW = 4.2;
const CAM_YAW = 5;
/** How far the camera is allowed to sit, from 1 (full) down toward the player. */
let camPull = 1;
/** Last time the camera was updated, for frame-rate independent lag. */
let camStamp = 0;
/** Top of the stone tiles, where feet and clicks land. */
const GROUND = 8;

const view = document.getElementById('view');
const canvas = view;
const ui = document.getElementById('hud');
const ctx = ui.getContext('2d');
const joystickElement = document.getElementById('joystick');
const joystickKnob = document.getElementById('joystickKnob');
const flipControl = document.getElementById('flipControl');
let gl = null;

const keys = { left: false, right: false, up: false, down: false };
const mobileKeys = { left: false, right: false, up: false, down: false };
const joystick = { pointerId: null, x: 0, y: 0 };

/**
 * Load one local SVG from the Lucide icon pack.
 * @param {string} name
 * @returns {HTMLImageElement}
 */
function loadHudIcon(name) {
  const image = new Image();
  image.src = 'icons/lucide/' + name + '.svg';
  return image;
}

/** Local Lucide icons keep the HUD consistent and available offline. */
const HUD_ICONS = {
  table: loadHudIcon('table'),
  wave: loadHudIcon('wave'),
  time: loadHudIcon('time'),
  play: loadHudIcon('play'),
};

let dpr = 1;
let last = 0;

const game = {
  mode: 'title',
  time: CLOCK,
  score: 0,
  best: 0,
  bested: false,
  wave: 1,
  banner: 0,
  bannerSub: '',
  shake: 0,
  sneaker: null,
  sneakerAwarded: false,
  speedFlash: 0,
  player: null,
  tables: [],
  merchants: [],
  particles: [],
  bubbles: [],
  timeBursts: [],
};

/**
 * Move a value toward a target. A higher rate arrives sooner.
 * @param {number} current
 * @param {number} target
 * @param {number} dt
 * @param {number} rate
 * @returns {number}
 */
function approach(current, target, dt, rate) {
  return current + (target - current) * (1 - Math.exp(-rate * dt));
}

/**
 * Clamp n to the inclusive range [a, b].
 * @param {number} n
 * @param {number} a
 * @param {number} b
 * @returns {number}
 */
function clamp(n, a, b) {
  return Math.max(a, Math.min(b, n));
}

/**
 * Random float in [a, b).
 * @param {number} a
 * @param {number} b
 * @returns {number}
 */
function rand(a, b) {
  return a + Math.random() * (b - a);
}

/**
 * Distance between two points.
 * @param {number} ax
 * @param {number} ay
 * @param {number} bx
 * @param {number} by
 * @returns {number}
 */
function dist(ax, ay, bx, by) {
  return Math.hypot(ax - bx, ay - by);
}

/**
 * Read the stored best score. Storage failures count as zero.
 * @returns {number}
 */
function loadBest() {
  try {
    const n = Number(localStorage.getItem(BEST_KEY));
    if (!Number.isFinite(n) || n < 0) return 0;
    return Math.floor(n);
  } catch (err) {
    return 0;
  }
}

/**
 * Store the best score. Ignore quota and privacy errors.
 * @param {number} score
 */
function saveBest(score) {
  try {
    localStorage.setItem(BEST_KEY, String(score));
  } catch (err) {
    /* private mode and file origins may refuse storage */
  }
}

/** Recorded foley (CC0), encoded to MP3. See sounds/foley/LICENSE.txt. */
const FOLEY = 'sounds/foley/';

/**
 * Build paths for a list of foley clip names.
 * @param {string[]} names
 * @returns {string[]}
 */
function foleySet(names) {
  const files = [];
  for (let i = 0; i < names.length; i++) files.push(FOLEY + names[i] + '.mp3');
  return files;
}

/** Wood, metal, coin, and stone recordings. No interface tones. */
const SFX = {
  flip: foleySet(['wood_breaking_01', 'wood_breaking_02', 'wood_falling_01', 'wood_falling_05', 'wood_falling_06']),
  kick: foleySet(['wood_hit_01', 'wood_hit_02', 'wood_hit_03', 'wood_hit_04', 'wood_hit_05', 'wood_hit_06']),
  crack: foleySet(['wood_cracking_01', 'wood_cracking_02', 'wood_cracking_03', 'wood_cracking_04']),
  dishes: foleySet(['metal_falling_01', 'metal_falling_02', 'metal_sheet_01']),
  land: foleySet(['wood_slam_01', 'wood_slam_02', 'wood_slam_03', 'wood_slam_04']),
  step: foleySet(['stone_l1', 'stone_l2', 'stone_l3', 'stone_r1', 'stone_r2', 'stone_r3']),
  shove: foleySet(['knock_1', 'knock_2', 'knock_3', 'knock_4', 'knock_5']),
  bell: foleySet(['clang_1', 'clang_2', 'clang_3', 'clang_4', 'clang_5']),
  cower: [
    'sounds/kenney-rpg/cloth1.mp3',
    'sounds/kenney-rpg/cloth2.mp3',
    'sounds/kenney-rpg/cloth3.mp3',
    'sounds/kenney-rpg/cloth4.mp3',
  ],
  wave: foleySet(['knock_1', 'knock_3', 'knock_5']),
};
/** Currently playing effects, so backgrounding can silence all audio. */
const activeSfx = new Set();

/**
 * Warm the clip files so the first flip does not wait on the network.
 */
function preloadSfx() {
  const seen = {};
  for (const bank of Object.keys(SFX)) {
    for (const src of SFX[bank]) {
      if (seen[src]) continue;
      seen[src] = true;
      const audio = new Audio();
      audio.preload = 'auto';
      audio.src = src;
    }
  }
}

/**
 * Play one random clip from a bank. Later hits can overlap.
 * @param {string} bank
 * @param {{volume?:number,rate?:number,delay?:number}} [opts]
 */
function playSfx(bank, opts) {
  const files = SFX[bank];
  if (!files || !files.length) return;
  const opt = opts || {};
  const audio = new Audio(files[Math.floor(Math.random() * files.length)]);
  audio.volume = opt.volume == null ? 0.55 : opt.volume;
  if (opt.rate) audio.playbackRate = opt.rate;
  const start = () => {
    if (document.hidden) return;
    activeSfx.add(audio);
    audio.addEventListener('ended', function () { activeSfx.delete(audio); }, { once: true });
    const pending = audio.play();
    if (pending && pending.catch) pending.catch(function () { activeSfx.delete(audio); });
  };
  if (opt.delay) window.setTimeout(start, opt.delay * 1000);
  else start();
}

/**
 * A little pitch scatter so repeated clips do not sound copied.
 * @returns {number}
 */
function sfxRate() {
  return 0.98 + Math.random() * 0.05;
}

/** Shared context for the coin chimes. */
let audioCtx = null;

/**
 * Create or resume audio after a click or key press.
 * @returns {AudioContext | null}
 */
function unlockAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (err) {
    return null;
  }
}

/**
 * One short coin in the splash. The pitch dips a little as it flies.
 * @param {AudioContext} ac
 * @param {AudioNode} dest
 * @param {number} time
 * @param {number} freq
 * @param {number} level
 */
function coinChime(ac, dest, time, freq, level) {
  const body = ac.createOscillator();
  const spark = ac.createOscillator();
  const amp = ac.createGain();
  const sparkAmp = ac.createGain();
  body.type = 'triangle';
  spark.type = 'sine';
  body.frequency.setValueAtTime(freq, time);
  spark.frequency.setValueAtTime(freq * 2, time);
  body.frequency.exponentialRampToValueAtTime(freq * 0.94, time + 0.14);
  amp.gain.setValueAtTime(0.0001, time);
  amp.gain.exponentialRampToValueAtTime(level, time + 0.006);
  amp.gain.exponentialRampToValueAtTime(0.0001, time + 0.15);
  sparkAmp.gain.setValueAtTime(0.0001, time);
  sparkAmp.gain.exponentialRampToValueAtTime(level * 0.4, time + 0.004);
  sparkAmp.gain.exponentialRampToValueAtTime(0.0001, time + 0.08);
  body.connect(amp);
  spark.connect(sparkAmp);
  amp.connect(dest);
  sparkAmp.connect(dest);
  body.start(time);
  spark.start(time);
  body.stop(time + 0.16);
  spark.stop(time + 0.1);
}

/**
 * A rising handful of coin chimes when a table first spills.
 */
function playCoinSplash() {
  const ac = unlockAudio();
  if (!ac) return;
  const bus = ac.createGain();
  bus.gain.setValueAtTime(0.7, ac.currentTime);
  bus.connect(ac.destination);
  const t = ac.currentTime + 0.02;
  const notes = [784, 988, 1175, 1568, 1976, 2349, 3136];
  for (let i = 0; i < notes.length; i++) {
    coinChime(ac, bus, t + i * 0.038, notes[i], 0.11);
  }
  for (let i = 0; i < 4; i++) {
    coinChime(ac, bus, t + 0.1 + i * 0.028, notes[4 + (i % 3)] * 1.25, 0.05);
  }
}

/** Eighth-note length of the hymn, in seconds. About 92 bpm. */
const HYMN_STEP = 60 / 92 / 2;
/** Lead voice, one MIDI note per eighth. 0 is a rest. */
const HYMN_LEAD = [
  62, 65, 67, 69, 69, 67, 65, 64,
  62, 65, 69, 72, 69, 67, 65, 62,
  65, 67, 69, 72, 74, 72, 69, 67,
  65, 64, 62, 65, 64, 62, 62, 0,
  69, 72, 74, 76, 77, 76, 74, 72,
  74, 72, 69, 67, 69, 67, 65, 64,
  65, 69, 72, 74, 72, 69, 67, 65,
  64, 62, 60, 62, 62, 62, 0, 0,
];
/** Alto, a third under the tune, one note per quarter. */
const HYMN_ALTO = [
  65, 64, 62, 60,
  62, 65, 64, 62,
  65, 69, 67, 64,
  62, 60, 62, 62,
  69, 67, 65, 64,
  65, 64, 62, 60,
  69, 67, 65, 64,
  62, 60, 62, 62,
];
/** Bass roots, one note per half note. */
const HYMN_BASS = [50, 45, 53, 48, 50, 45, 48, 50, 53, 48, 46, 45, 43, 45, 48, 50];
/** True once the background track is running. */
let musicOn = false;
/** Seamlessly looping CC0 16-bit background track. */
let musicTrack = null;
/** Next step time on the audio clock. */
let musicNext = 0;
/** Index into the hymn, in eighth notes. */
let musicStep = 0;
/** Short noise burst reused for the soft beat. */
let musicNoise = null;
/** Crushed music bus, kept apart from the sound effects. */
let musicBus = null;

/**
 * Frequency of a MIDI note number.
 * @param {number} note
 * @returns {number}
 */
function midiFreq(note) {
  return 440 * Math.pow(2, (note - 69) / 12);
}

/**
 * Quantize the hymn so it sounds like a low-rate game cartridge.
 * @param {number} bits
 * @returns {Float32Array}
 */
function crushCurve(bits) {
  const n = 1024;
  const steps = Math.pow(2, bits);
  const curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * 2 - 1;
    curve[i] = Math.round(x * steps) / steps;
  }
  return curve;
}

/**
 * Build the crushed hymn bus and a tiny noise tick.
 * @param {AudioContext} ac
 */
function buildMusic(ac) {
  const crush = ac.createWaveShaper();
  crush.curve = crushCurve(5);
  crush.oversample = '4x';
  const low = ac.createBiquadFilter();
  low.type = 'lowpass';
  low.frequency.value = 2800;
  const master = ac.createGain();
  master.gain.value = 0.42;
  crush.connect(low);
  low.connect(master);
  master.connect(ac.destination);
  musicBus = crush;
  const len = Math.floor(ac.sampleRate * 0.04);
  musicNoise = ac.createBuffer(1, len, ac.sampleRate);
  const data = musicNoise.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
}

/**
 * One cartridge voice on the hymn bus.
 * @param {number} time
 * @param {number} note MIDI note, or 0 for a rest.
 * @param {number} dur
 * @param {OscillatorType} type
 * @param {number} level
 */
function hymnNote(time, note, dur, type, level) {
  if (!note || !audioCtx || !musicBus) return;
  const osc = audioCtx.createOscillator();
  const amp = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(midiFreq(note), time);
  amp.gain.setValueAtTime(level, time);
  amp.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  osc.connect(amp);
  amp.connect(musicBus);
  osc.start(time);
  osc.stop(time + dur + 0.02);
}

/**
 * A quiet tick on the beat, so the hymn still feels like a game.
 * @param {number} time
 * @param {number} level
 */
function hymnTick(time, level) {
  if (!audioCtx || !musicNoise || !musicBus) return;
  const src = audioCtx.createBufferSource();
  const amp = audioCtx.createGain();
  const high = audioCtx.createBiquadFilter();
  src.buffer = musicNoise;
  high.type = 'highpass';
  high.frequency.value = 1800;
  amp.gain.setValueAtTime(level, time);
  amp.gain.exponentialRampToValueAtTime(0.0001, time + 0.04);
  src.connect(high);
  high.connect(amp);
  amp.connect(musicBus);
  src.start(time);
  src.stop(time + 0.05);
}

/**
 * Schedule the next few eighths of the looping hymn.
 */
function pumpMusic() {
  // The encoded track loops itself; this remains for the main-loop contract.
}

/**
 * Start the 16-bit battle theme once. Later runs leave it looping.
 */
function startMusic() {
  unlockAudio();
  if (musicOn) return;
  if (!musicTrack) {
    musicTrack = new Audio('sounds/music/blood-stained-glass.mp3');
    musicTrack.preload = 'auto';
    musicTrack.loop = true;
    musicTrack.volume = 0.4;
  }
  musicOn = true;
  const pending = musicTrack.play();
  if (pending && pending.catch) pending.catch(() => { musicOn = false; });
}

/**
 * Pause every audio source while the page is not visible.
 */
function pauseBackgroundAudio() {
  if (musicTrack) musicTrack.pause();
  for (const audio of activeSfx) audio.pause();
  activeSfx.clear();
  if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
}

/**
 * Continue the music after returning to an already-started game.
 */
function resumeForegroundAudio() {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (!musicOn || !musicTrack || !musicTrack.paused) return;
  const pending = musicTrack.play();
  if (pending && pending.catch) pending.catch(function () {});
}

/**
 * Keep game audio aligned with browser/app visibility.
 */
function onVisibilityChange() {
  if (document.hidden) pauseBackgroundAudio();
  else resumeForegroundAudio();
}

/**
 * Wood and dishes when a table is flipped. Coins chime on the first spill.
 * @param {object} table
 * @param {boolean} again
 */
function playFlip(table, again) {
  playSfx(again ? 'kick' : 'flip', { volume: again ? 0.5 : 0.62, rate: sfxRate() });
  playSfx('dishes', { volume: again ? 0.2 : 0.32, delay: 0.03, rate: sfxRate() });
  if (!again) playCoinSplash();
  if (table.scars && table.scars.hits >= 3) {
    playSfx('crack', { volume: 0.26, delay: 0.05, rate: sfxRate() });
  }
}

/**
 * Stone steps on the beat of the walk cycle.
 * @param {object} p
 */
function tickSteps(p) {
  const sign = Math.sin(p.bob) >= 0 ? 1 : -1;
  if (p.walking && p.gait > 0.45 && p.stepSign && sign !== p.stepSign) {
    playSfx('step', { volume: 0.34 + 0.12 * p.gait, rate: sfxRate() });
  }
  p.stepSign = p.walking ? sign : 0;
}

/**
 * Player standing at the bottom center of the court.
 * @returns {{x:number,y:number,yaw:number,bob:number,moving:boolean,swing:number}}
 */
function makePlayer() {
  return { x: 480, y: 460, yaw: Math.PI, bob: 0, moving: false, swing: 0 };
}

/**
 * Expand the playable temple around its fixed center for a wave.
 * @param {number} wave
 */
function setCourtSize(wave) {
  const growth = Math.max(0, wave - 1);
  const halfW = 410 + growth * COURT_GROW_X / 2;
  const halfD = 220 + growth * COURT_GROW_Z / 2;
  FLOOR.l = 480 - halfW;
  FLOOR.r = 480 + halfW;
  FLOOR.t = 330 - halfD;
  FLOOR.b = 330 + halfD;
}

/**
 * A random table footprint on the open floor.
 * @returns {{x:number,y:number,w:number}}
 */
function randomSpot() {
  const w = rand(78, 96);
  return {
    w,
    x: rand(FLOOR.l + w / 2 + 10, FLOOR.r - w / 2 - 10),
    y: rand(FLOOR.t + 64, FLOOR.b - 40),
  };
}

/**
 * A spot far from the player, used only when random placement finds nothing.
 * @returns {{x:number,y:number,w:number}}
 */
function emergencySpot() {
  const corners = [
    { x: FLOOR.l + 90, y: FLOOR.t + 80 },
    { x: FLOOR.r - 90, y: FLOOR.t + 80 },
    { x: FLOOR.l + 90, y: FLOOR.b - 60 },
    { x: FLOOR.r - 90, y: FLOOR.b - 60 },
  ];
  let best = corners[0];
  let bestD = -1;
  for (const corner of corners) {
    const d = dist(corner.x, corner.y, game.player.x, game.player.y);
    if (d > bestD) {
      bestD = d;
      best = corner;
    }
  }
  return { x: best.x, y: best.y, w: 86 };
}

/**
 * Place a table at least 110px from the others and 120px from the player.
 * After a few hundred misses, keep the roomiest gap that is not inside the player.
 * @param {{x:number,y:number}[]} existing
 * @returns {{x:number,y:number,w:number}}
 */
function findSpot(existing) {
  let best = null;
  let bestScore = -1;
  let fallback = null;
  let fallbackScore = -1;
  for (let i = 0; i < 400; i++) {
    const spot = randomSpot();
    const fromPlayer = dist(spot.x, spot.y, game.player.x, game.player.y);
    if (fromPlayer < BODY_GAP) continue;
    let nearest = Infinity;
    for (const other of existing) {
      nearest = Math.min(nearest, dist(spot.x, spot.y, other.x, other.y));
    }
    if (game.sneaker) {
      nearest = Math.min(nearest, dist(spot.x, spot.y, game.sneaker.x, game.sneaker.y));
    }
    const gap = Math.min(fromPlayer, nearest);
    if (gap > fallbackScore) {
      fallbackScore = gap;
      fallback = spot;
    }
    if (fromPlayer < CLEARANCE) continue;
    if (nearest < SEP) continue;
    if (existing.length === 0) return spot;
    if (nearest > bestScore) {
      bestScore = nearest;
      best = spot;
    }
  }
  return best || fallback || emergencySpot();
}

/**
 * A pacing spot just beside a table, kept inside the room.
 * @param {{x:number,y:number,w:number}} table
 * @returns {{x:number,y:number}}
 */
function merchantSpot(table) {
  const inward = table.x < (FLOOR.l + FLOOR.r) / 2 ? 1 : -1;
  let x = table.x + inward * (table.w * 0.42 + 28);
  x = clamp(x, FLOOR.l + 20, FLOOR.r - 20);
  if (Math.abs(x - table.x) < 36) {
    x = clamp(table.x - inward * (table.w * 0.42 + 28), FLOOR.l + 20, FLOOR.r - 20);
  }
  const y = clamp(table.y + rand(-6, 16), FLOOR.t + 48, FLOOR.b - 12);
  return { x, y };
}

/**
 * Spawn one merchant per table.
 * @param {number} count
 */
function spawnWave(count) {
  const placed = [];
  game.tables = [];
  game.merchants = [];
  for (let i = 0; i < count; i++) {
    const spot = findSpot(placed);
    placed.push(spot);
    const table = {
      x: spot.x,
      y: spot.y,
      w: spot.w,
      flipped: false,
      anim: 0,
      fall: 1,
      rx: 0,
      ry: 0,
      rz: 0,
      vrx: 0,
      vry: 0,
      vrz: 0,
      h: 0,
      vh: 0,
      cloth: CLOTHS[i % CLOTHS.length],
      coins: [
        { x: rand(-18, -4), z: rand(-6, 8), r: rand(3.6, 5) },
        { x: rand(2, 16), z: rand(-8, 6), r: rand(3.2, 4.4) },
        { x: rand(-6, 8), z: rand(-2, 10), r: 3.4 },
      ],
    };
    game.tables.push(table);
    const spotM = merchantSpot(table);
    game.merchants.push({
      x: spotM.x,
      y: spotM.y,
      homeX: spotM.x,
      homeY: spotM.y,
      color: i % 2 === 0 ? '#7a5584' : '#c45c52',
      facing: spotM.x < table.x ? 1 : -1,
      yaw: spotM.x < table.x ? 0.5 : -0.5,
      vx: 0,
      vy: 0,
      h: 0,
      vh: 0,
      air: false,
      spin: 0,
      spinV: 0,
      phase: rand(0, Math.PI * 2),
      flee: false,
      run: 0,
    });
  }
}

/**
 * Start a run from the title card or the game-over card.
 */
function startRun() {
  unlockAudio();
  startMusic();
  game.mode = 'play';
  game.time = CLOCK;
  game.score = 0;
  game.bested = false;
  game.wave = 1;
  game.banner = BANNER_TIME;
  game.bannerSub = 'flip the table';
  game.shake = 12;
  game.sneaker = null;
  game.sneakerAwarded = false;
  game.speedFlash = 0;
  game.player = makePlayer();
  setCourtSize(1);
  camYaw = game.player.yaw;
  camX = game.player.x;
  camZ = game.player.y;
  camPull = 1;
  game.particles = [];
  game.bubbles = [];
  game.timeBursts = [];
  spawnWave(1);
  playSfx('wave', { volume: 0.42, rate: 1 });
}

/**
 * End the run when the clock hits zero, and store a higher best.
 */
function endRun() {
  game.mode = 'over';
  playSfx('bell', { volume: 0.42, rate: 1.04 });
  if (game.score > game.best) {
    game.best = game.score;
    game.bested = true;
    saveBest(game.best);
  }
}

/**
 * Map a keyboard event onto a stable code.
 * @param {KeyboardEvent} e
 * @returns {string}
 */
function codeOf(e) {
  if (e.code) return e.code;
  const map = {
    ' ': 'Space',
    Enter: 'Enter',
    ArrowLeft: 'ArrowLeft',
    ArrowRight: 'ArrowRight',
    ArrowUp: 'ArrowUp',
    ArrowDown: 'ArrowDown',
    a: 'KeyA',
    A: 'KeyA',
    d: 'KeyD',
    D: 'KeyD',
    w: 'KeyW',
    W: 'KeyW',
    s: 'KeyS',
    S: 'KeyS',
    e: 'KeyE',
    E: 'KeyE',
  };
  return map[e.key] || '';
}

/**
 * Set one movement key. Other codes are ignored.
 * @param {string} code
 * @param {boolean} down
 */
function setKey(code, down) {
  if (code === 'ArrowLeft' || code === 'KeyA') keys.left = down;
  else if (code === 'ArrowRight' || code === 'KeyD') keys.right = down;
  else if (code === 'ArrowUp' || code === 'KeyW') keys.up = down;
  else if (code === 'ArrowDown' || code === 'KeyS') keys.down = down;
}

/**
 * Movement keys, a one-shot flip, or starting a run.
 * @param {KeyboardEvent} e
 */
function onKeyDown(e) {
  const code = codeOf(e);
  if (code === 'Space' || code === 'Enter' || code.indexOf('Arrow') === 0 || code === 'KeyW' || code === 'KeyA' || code === 'KeyS' || code === 'KeyD' || code === 'KeyE') {
    e.preventDefault();
  }
  if (e.repeat) return;
  setKey(code, true);
  if (game.mode !== 'play') {
    if (code === 'Enter' || code === 'Space') startRun();
    return;
  }
  if (code === 'Space' || code === 'KeyE') {
    tryFlipAt(game.player.x, game.player.y, KEY_RANGE);
  }
}

/**
 * Release a movement key.
 * @param {KeyboardEvent} e
 */
function onKeyUp(e) {
  setKey(codeOf(e), false);
}

/**
 * Start from the visible title or replay button without enabling gameplay gestures.
 * @param {PointerEvent} e
 */
function onCanvasStart(e) {
  if (game.mode === 'play') return;
  const rect = view.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / (rect.width || W)) * W;
  const y = ((e.clientY - rect.top) / (rect.height || H)) * H;
  const titleHit = game.mode === 'title' && x >= 338 && x <= 622 && y >= 382 && y <= 434;
  const replayHit = game.mode === 'over' && x >= 358 && x <= 602 && y >= 300 && y <= 336;
  if (!titleHit && !replayHit) return;
  if (e.cancelable) e.preventDefault();
  canvas.focus({ preventScroll: true });
  startRun();
}

/**
 * Reset the mobile joystick and release all virtual movement keys.
 * @param {number} [pointerId]
 */
function resetJoystick(pointerId) {
  if (pointerId != null && joystick.pointerId !== pointerId) return;
  joystick.pointerId = null;
  joystick.x = 0;
  joystick.y = 0;
  mobileKeys.left = false;
  mobileKeys.right = false;
  mobileKeys.up = false;
  mobileKeys.down = false;
  joystickKnob.style.transform = 'translate(-50%, -50%)';
}

/**
 * Turn joystick displacement into the four movement keys.
 * @param {PointerEvent} e
 */
function updateJoystick(e) {
  if (e.pointerId !== joystick.pointerId) return;
  const rect = joystickElement.getBoundingClientRect();
  const max = rect.width * 0.29;
  let dx = e.clientX - (rect.left + rect.width / 2);
  let dy = e.clientY - (rect.top + rect.height / 2);
  const distance = Math.hypot(dx, dy);
  if (distance > max) {
    dx = dx / distance * max;
    dy = dy / distance * max;
  }
  const nx = dx / max;
  const ny = dy / max;
  const dead = 0.3;
  joystick.x = Math.abs(nx) > dead ? Math.sign(nx) * (Math.abs(nx) - dead) / (1 - dead) : 0;
  joystick.y = Math.abs(ny) > dead ? Math.sign(ny) * (Math.abs(ny) - dead) / (1 - dead) : 0;
  mobileKeys.left = joystick.x < 0;
  mobileKeys.right = joystick.x > 0;
  mobileKeys.up = ny < -dead;
  mobileKeys.down = ny > dead;
  joystickKnob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
}

/**
 * Capture a mobile joystick drag and start the run if needed.
 * @param {PointerEvent} e
 */
function onJoystickDown(e) {
  e.preventDefault();
  if (game.mode !== 'play') startRun();
  joystick.pointerId = e.pointerId;
  joystickElement.setPointerCapture(e.pointerId);
  updateJoystick(e);
}

/**
 * Flip the closest reachable table, or start from an overlay.
 * @param {PointerEvent} e
 */
function onMobileFlip(e) {
  e.preventDefault();
  if (game.mode !== 'play') {
    startRun();
    return;
  }
  tryFlipAt(game.player.x, game.player.y, KEY_RANGE);
}

/**
 * Nearest table within range, upright or already flipped.
 * @param {number} x
 * @param {number} y
 * @param {number} range
 * @returns {object | null}
 */
function nearestUpright(x, y, range) {
  let best = null;
  let bestD = range;
  for (const table of game.tables) {
    const d = dist(table.x, table.y, x, y);
    if (d <= bestD) {
      bestD = d;
      best = table;
    }
  }
  return best;
}

/**
 * Flip the nearest upright table in range when the banner allows it.
 * @param {number} x
 * @param {number} y
 * @param {number} range
 * @returns {boolean}
 */
function tryFlipAt(x, y, range) {
  if (game.mode !== 'play') return false;
  if (game.banner > FLIP_LOCK) return false;
  const table = nearestUpright(x, y, range);
  if (!table) return false;
  flipTable(table);
  return true;
}

/**
 * Pop a merchant up and away from a flipped table.
 * @param {object} merchant
 * @param {object} table
 */
function launchMerchant(merchant, table) {
  const dx = merchant.x - table.x || (Math.random() < 0.5 ? -1 : 1);
  const dy = merchant.y - table.y;
  const len = Math.hypot(dx, dy) || 1;
  merchant.vx = (dx / len) * 160 + rand(-30, 30);
  merchant.vy = (dy / len) * 160 + rand(-30, 30);
  merchant.vh = 460;
  merchant.h = 0;
  merchant.air = true;
  merchant.flee = false;
  merchant.spin = 0;
  merchant.spinV = rand(-8, 8);
  if (Math.abs(merchant.spinV) < 4) merchant.spinV = merchant.spinV < 0 ? -6 : 6;
  playSfx('shove', { volume: 0.34, rate: sfxRate() });
}

/**
 * Coins and scrolls bursting off a table.
 * @param {object} table
 * @param {number} [count]
 */
function burst(table, count) {
  const n = count || 10;
  for (let i = 0; i < n; i++) {
    game.particles.push({
      kind: i < n * 0.7 ? 'coin' : 'scroll',
      x: table.x + rand(-16, 16),
      y: table.y + rand(-10, 10),
      h: 34,
      vx: rand(-80, 80),
      vy: rand(-80, 80),
      vh: rand(220, 420),
      rot: rand(0, 6),
      vr: rand(-7, 7),
      age: 0,
      life: rand(0.55, 0.95),
    });
  }
}

/**
 * Break a table a little more on every hit: cracks, then legs, then the top.
 * @param {object} table
 */
function scarTable(table) {
  if (!table.scars) {
    table.scars = {
      dent: { x: rand(-10, 8), z: rand(-6, 6) },
      legs: [],
      cracks: [],
      hits: 0,
    };
  }
  const scars = table.scars;
  scars.hits += 1;
  if (scars.cracks.length < 8) {
    scars.cracks.push({
      x: rand(-14, 14),
      z: rand(-10, 10),
      yaw: rand(0, Math.PI),
      len: rand(10, 16) + Math.min(scars.hits, 5) * 2,
    });
  }
  const wantLegs = Math.min(4, scars.hits);
  while (scars.legs.length < wantLegs) {
    let placed = false;
    for (let n = 0; n < 4; n++) {
      if (scars.legs.indexOf(n) >= 0) continue;
      scars.legs.push(n);
      placed = true;
      break;
    }
    if (!placed) break;
  }
}

/**
 * Shove a table so it flips over and keeps spinning.
 * @param {object} table
 */
function kickTable(table) {
  const dir = game.player && game.player.x <= table.x ? 1 : -1;
  table.fall = dir;
  table.vrx += dir * 8;
  table.vry += dir * rand(5, 10);
  table.vrz += rand(-4, 4);
  const cap = 18;
  table.vrx = clamp(table.vrx, -cap, cap);
  table.vry = clamp(table.vry, -cap, cap);
  table.vrz = clamp(table.vrz, -cap, cap);
  table.vh = Math.min(150, table.vh + 80);
}

/**
 * Overturn a table, or spin one that is already down.
 * Only the first hit scores and startles the court.
 * @param {object} table
 */
function flipTable(table) {
  const again = table.flipped;
  if (!again) {
    table.flipped = true;
    table.anim = 0;
    table.fall = game.player.x <= table.x ? 1 : -1;
    game.score += 1;
    game.time += FLIP_TIME_BONUS;
    game.timeBursts.push({
      x: table.x,
      y: table.y,
      age: 0,
      life: 1.15,
    });
  }
  kickTable(table);
  scarTable(table);
  game.shake = again ? 5 : 7;
  burst(table, again ? 6 : 10);

  if (!again) {
    let speaker = null;
    let speakerD = MERCHANT_R;
    for (const merchant of game.merchants) {
      const d = dist(merchant.x, merchant.y, table.x, table.y);
      if (d > MERCHANT_R) continue;
      launchMerchant(merchant, table);
      if (d <= speakerD) {
        speakerD = d;
        speaker = merchant;
      }
    }
    game.bubbles.push({
      merchant: speaker,
      x: speaker ? speaker.x : table.x,
      y: speaker ? speaker.y : table.y,
      age: 0,
      life: 0.9,
    });
  }
  if (dist(game.player.x, game.player.y, table.x, table.y) <= KEY_RANGE + 36) {
    const dx = table.x - game.player.x;
    const dy = table.y - game.player.y;
    if (Math.hypot(dx, dy) > 1) game.player.yaw = Math.atan2(dx, dy);
    game.player.swing = SWING_TIME;
  }
  playFlip(table, again);
}

/**
 * Wrap an angle into the range -π to π.
 * @param {number} angle
 * @returns {number}
 */
function wrapAngle(angle) {
  let wrapped = angle;
  while (wrapped > Math.PI) wrapped -= Math.PI * 2;
  while (wrapped < -Math.PI) wrapped += Math.PI * 2;
  return wrapped;
}

/**
 * Move an angle toward another, taking the short way around.
 * @param {number} current
 * @param {number} target
 * @param {number} dt
 * @param {number} speed Radians per second.
 * @returns {number}
 */
function turnToward(current, target, dt, speed) {
  let delta = wrapAngle(target - current);
  const step = speed * dt;
  if (Math.abs(delta) <= step) return target;
  return current + Math.sign(delta) * step;
}

/**
 * Turn with left and right, and walk forward or back along that facing.
 * @param {number} dt
 */
function updatePlayer(dt) {
  const p = game.player;
  const turn = 3.6 * dt;
  const up = keys.up || mobileKeys.up;
  const down = keys.down || mobileKeys.down;
  if (keys.left) p.yaw += turn;
  if (keys.right) p.yaw -= turn;
  p.yaw -= joystick.x * 1.65 * dt;
  p.yaw = wrapAngle(p.yaw);

  let x = 0;
  let y = 0;
  const fx = Math.sin(p.yaw);
  const fy = Math.cos(p.yaw);
  if (up) {
    x += fx;
    y += fy;
  }
  if (down) {
    x -= fx;
    y -= fy;
  }
  const len = Math.hypot(x, y);
  p.walking = len > 0.001;
  p.moving = p.walking || keys.left || keys.right || Math.abs(joystick.x) > 0.001;
  if (len > 0.001) {
    const nx = x / len;
    const ny = y / len;
    const speed = p.sneakers ? BOOST_SPEED : SPEED;
    p.x += nx * speed * dt;
    p.y += ny * speed * dt;
  }
  const stood = separateFromTables(p.x, p.y, BODY);
  p.x = clamp(stood.x, FLOOR.l, FLOOR.r);
  p.y = clamp(stood.y, FLOOR.t, FLOOR.b);
  p.gait = approach(p.gait || 0, p.moving ? 1 : 0, dt, 10);
  p.bob += dt * (2.4 + 8.6 * p.gait);
  tickSteps(p);
  const tossWant = p.swing > 0 ? Math.min(1, (1 - p.swing / SWING_TIME) * 1.7) : 0;
  p.toss = approach(p.toss || 0, tossWant, dt, 16);
  if (p.swing > 0) p.swing = Math.max(0, p.swing - dt);
}

/**
 * Tip the first flip closed, then keep tumbling any table that was hit again.
 * @param {number} dt
 */
function updateTables(dt) {
  for (const table of game.tables) {
    if (!table.flipped) continue;
    if (table.anim < FLIP_ANIM) table.anim = Math.min(FLIP_ANIM, table.anim + dt);
    table.rx += table.vrx * dt;
    table.ry += table.vry * dt;
    table.rz += table.vrz * dt;
    const damp = Math.exp(-1.3 * dt);
    table.vrx *= damp;
    table.vry *= damp;
    table.vrz *= damp;
    if (Math.hypot(table.vrx, table.vry, table.vrz) < 0.2) {
      table.vrx = 0;
      table.vry = 0;
      table.vrz = 0;
    }
    table.vh -= 240 * dt;
    table.h += table.vh * dt;
    if (table.h <= 0 && table.vh < 0) {
      const hit = -table.vh;
      table.h = 0;
      table.vh *= -0.22;
      if (hit > 40) playSfx('land', { volume: Math.min(0.46, hit / 280), rate: sfxRate() });
      if (Math.abs(table.vh) < 28) table.vh = 0;
    }
    restTable(table, dt);
  }
}

/**
 * Horizontal footprint of a tumbled table, before its yaw is applied.
 * Heights are above the floor.
 * @param {object} table
 * @returns {{minX:number,maxX:number,minZ:number,maxZ:number,low:number}}
 */
function tableFootprint(table) {
  const hx = table.w / 2;
  const hz = 22;
  const rx = table.rx || 0;
  const rz = table.rz || 0;
  const cx = Math.cos(rx);
  const sx = Math.sin(rx);
  const cz = Math.cos(rz);
  const sz = Math.sin(rz);
  const lift = tableLift(table);
  let minX = Infinity;
  let maxX = -Infinity;
  let minZ = Infinity;
  let maxZ = -Infinity;
  let low = Infinity;
  const xs = [-hx, hx];
  const ys = [-16, 24];
  const zs = [-hz, hz];
  for (let i = 0; i < 2; i++) {
    for (let j = 0; j < 2; j++) {
      for (let k = 0; k < 2; k++) {
        const x = xs[i];
        const y = ys[j];
        const z = zs[k];
        const x1 = cz * x - sz * y;
        const y1 = sz * x + cz * y;
        const y2 = cx * y1 - sx * z;
        const z2 = sx * y1 + cx * z;
        const height = lift + y2 + 16;
        if (x1 < minX) minX = x1;
        if (x1 > maxX) maxX = x1;
        if (z2 < minZ) minZ = z2;
        if (z2 > maxZ) maxZ = z2;
        if (height < low) low = height;
      }
    }
  }
  return { minX: minX, maxX: maxX, minZ: minZ, maxZ: maxZ, low: low };
}

/**
 * Push a ground circle out of every table it overlaps.
 * A table hopping overhead is left alone.
 * @param {number} x
 * @param {number} y
 * @param {number} radius
 * @returns {{x:number,y:number}}
 */
function separateFromTables(x, y, radius) {
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < game.tables.length; i++) {
      const table = game.tables[i];
      const box = tableFootprint(table);
      if (box.low > TABLE_CLEAR) continue;
      const ry = table.ry || 0;
      const c = Math.cos(ry);
      const s = Math.sin(ry);
      const dx = x - table.x;
      const dz = y - table.y;
      let lx = c * dx - s * dz;
      let lz = s * dx + c * dz;
      const nearestX = clamp(lx, box.minX, box.maxX);
      const nearestZ = clamp(lz, box.minZ, box.maxZ);
      let ox = lx - nearestX;
      let oz = lz - nearestZ;
      const distApart = Math.hypot(ox, oz);
      if (distApart >= radius) continue;
      if (distApart > 0.001) {
        const push = (radius - distApart) / distApart;
        lx += ox * push;
        lz += oz * push;
      } else {
        const left = lx - box.minX;
        const right = box.maxX - lx;
        const back = lz - box.minZ;
        const front = box.maxZ - lz;
        const min = Math.min(left, right, back, front);
        if (min === left) lx = box.minX - radius;
        else if (min === right) lx = box.maxX + radius;
        else if (min === back) lz = box.minZ - radius;
        else lz = box.maxZ + radius;
      }
      x = table.x + c * lx + s * lz;
      y = table.y - s * lx + c * lz;
    }
  }
  return { x: x, y: y };
}

/**
 * Nearest quarter-turn, so a table can lie on a face.
 * @param {number} angle
 * @returns {number}
 */
function nearestFlat(angle) {
  const step = Math.PI / 2;
  return Math.round(angle / step) * step;
}

/**
 * Once a table slows down, ease it onto the nearest flat face.
 * @param {object} table
 * @param {number} dt
 */
function restTable(table, dt) {
  const speed = Math.hypot(table.vrx, table.vry, table.vrz);
  if (speed > 1.6 || table.h > 2) return;
  const tx = nearestFlat(table.rx);
  const tz = nearestFlat(table.rz);
  table.rx = turnToward(table.rx, tx, dt, 5);
  table.rz = turnToward(table.rz, tz, dt, 5);
  table.vrx = 0;
  table.vrz = 0;
  table.vry *= Math.exp(-3 * dt);
  if (Math.abs(wrapAngle(table.rx - tx)) < 0.02 && Math.abs(wrapAngle(table.rz - tz)) < 0.02) {
    table.rx = tx;
    table.rz = tz;
    table.vry = 0;
  }
}

/**
 * Lowest point of the table's box after it tumbles, in model space.
 * Spin is around the center of the table, then shifted back down.
 * @param {object} table
 * @returns {number}
 */
function tableBottom(table) {
  const hx = table.w / 2;
  const hz = 23;
  const cx = Math.cos(table.rx);
  const sx = Math.sin(table.rx);
  const cz = Math.cos(table.rz);
  const sz = Math.sin(table.rz);
  let minY = Infinity;
  const xs = [-hx, hx];
  const ys = [-16, 24];
  const zs = [-hz, hz];
  for (let i = 0; i < 2; i++) {
    for (let j = 0; j < 2; j++) {
      for (let k = 0; k < 2; k++) {
        const x = xs[i];
        const y = ys[j];
        const z = zs[k];
        const y1 = sz * x + cz * y;
        const z1 = z;
        const y2 = cx * y1 - sx * z1;
        if (y2 + 16 < minY) minY = y2 + 16;
      }
    }
  }
  return minY;
}

/**
 * Height added so the lowest corner sits on the floor, plus any hop.
 * @param {object} table
 * @returns {number}
 */
function tableLift(table) {
  return Math.max(0, -tableBottom(table)) + (table.h || 0);
}

/**
 * Pace in a small loop, or fly, bounce, and settle after a launch.
 * @param {object} merchant
 * @param {number} dt
 */
function updateMerchant(merchant, dt) {
  fleeFromPlayer(merchant);
  const duckWant = merchant.flee && (merchant.h || 0) < 8 ? 1 : 0;
  merchant.duck = approach(merchant.duck || 0, duckWant, dt, 12);
  if (merchant.flee) {
    merchant.vx = 0;
    merchant.vy = 0;
    merchant.h = 0;
    merchant.vh = 0;
    merchant.air = false;
    merchant.yaw = turnToward(merchant.yaw || 0, merchant.face || 0, dt, 8);
    return;
  }
  const moving = merchant.air || merchant.h > 0.5 || merchant.vh !== 0 || Math.abs(merchant.vx) > 12 || Math.abs(merchant.vy) > 12;
  if (moving) {
    merchant.vh -= 1500 * dt;
    merchant.h += merchant.vh * dt;
    merchant.x += merchant.vx * dt;
    merchant.y += merchant.vy * dt;
    merchant.spin += merchant.spinV * dt;
    if (merchant.x < FLOOR.l + 16) {
      merchant.x = FLOOR.l + 16;
      merchant.vx = Math.abs(merchant.vx) * 0.4;
    }
    if (merchant.x > FLOOR.r - 16) {
      merchant.x = FLOOR.r - 16;
      merchant.vx = -Math.abs(merchant.vx) * 0.4;
    }
    if (merchant.y < FLOOR.t + 20) {
      merchant.y = FLOOR.t + 20;
      merchant.vy = Math.abs(merchant.vy) * 0.4;
    }
    if (merchant.y > FLOOR.b - 12) {
      merchant.y = FLOOR.b - 12;
      merchant.vy = -Math.abs(merchant.vy) * 0.4;
    }
    if (merchant.h <= 0 && merchant.vh < 0) {
      merchant.h = 0;
      merchant.vh = -merchant.vh * 0.28;
      merchant.vx *= 0.62;
      merchant.vy *= 0.62;
      if (merchant.vh < 90) merchant.vh = 0;
    }
    if (merchant.h === 0 && merchant.vh === 0) {
      merchant.vx *= Math.exp(-3.2 * dt);
      merchant.vy *= Math.exp(-3.2 * dt);
      merchant.spin *= Math.exp(-10 * dt);
    }
    if (merchant.h === 0 && merchant.vh === 0 && Math.abs(merchant.vx) < 12 && Math.abs(merchant.vy) < 12) {
      merchant.vx = 0;
      merchant.vy = 0;
      merchant.air = false;
      merchant.spin = 0;
      merchant.spinV = 0;
      merchant.homeX = merchant.x;
      merchant.homeY = merchant.y;
      merchant.phase = 0;
    }
    if (Math.abs(merchant.vx) > 8) merchant.yaw = Math.atan2(merchant.vx, merchant.vy);
    plantMerchant(merchant);
    return;
  }
  merchant.h = 0;
  merchant.phase += dt;
  merchant.x = clamp(merchant.homeX + Math.sin(merchant.phase * 1.35) * 16, FLOOR.l + 16, FLOOR.r - 16);
  merchant.y = clamp(merchant.homeY + Math.sin(merchant.phase * 0.65) * 5, FLOOR.t + 40, FLOOR.b - 6);
  merchant.facing = Math.cos(merchant.phase * 1.35) >= 0 ? 1 : -1;
  const pace = merchant.facing > 0 ? 0.55 : -0.55;
  merchant.yaw = turnToward(merchant.yaw == null ? pace : merchant.yaw, pace, dt, 7);
  plantMerchant(merchant);
}

/**
 * Keep a merchant on the floor from standing inside a table.
 * @param {object} merchant
 */
function plantMerchant(merchant) {
  if ((merchant.h || 0) > 8) return;
  const next = separateFromTables(merchant.x, merchant.y, BODY + 2);
  merchant.x = clamp(next.x, FLOOR.l + 16, FLOOR.r - 16);
  merchant.y = clamp(next.y, FLOOR.t + 20, FLOOR.b - 12);
}

/**
 * Duck in place when the player gets close.
 * A hard table-flip launch is left alone.
 * @param {object} merchant
 */
function fleeFromPlayer(merchant) {
  if (!game.player) return;
  if (merchant.h > 36 || merchant.vh > 240) {
    merchant.flee = false;
    return;
  }
  const dx = game.player.x - merchant.x;
  const dy = game.player.y - merchant.y;
  const distApart = Math.hypot(dx, dy);
  const panic = 160;
  if (distApart >= panic) {
    if (!merchant.flee) return;
    merchant.flee = false;
    merchant.vx = 0;
    merchant.vy = 0;
    merchant.homeX = merchant.x;
    merchant.homeY = merchant.y;
    merchant.phase = 0;
    return;
  }
  const started = !merchant.flee;
  merchant.flee = true;
  merchant.vx = 0;
  merchant.vy = 0;
  merchant.face = Math.atan2(dx, dy);
  if (started) playSfx('cower', { volume: 0.4, rate: sfxRate() });
  if (distApart < 30 && distApart > 0.001) {
    const gap = 30 - distApart;
    const nx = -dx / distApart;
    const ny = -dy / distApart;
    merchant.x = clamp(merchant.x + nx * gap, FLOOR.l + 16, FLOOR.r - 16);
    merchant.y = clamp(merchant.y + ny * gap, FLOOR.t + 20, FLOOR.b - 12);
  }
}

/**
 * Gravity for the short-lived coins and scrolls.
 * @param {number} dt
 */
function updateParticles(dt) {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const particle = game.particles[i];
    particle.vh -= 1400 * dt;
    particle.h += particle.vh * dt;
    particle.x += particle.vx * dt;
    particle.y += particle.vy * dt;
    particle.rot += particle.vr * dt;
    particle.age += dt;
    if (particle.h < 2 && particle.vh < 0) {
      particle.h = 2;
      particle.vh *= -0.32;
      particle.vx *= 0.7;
      particle.vy *= 0.7;
    }
    if (particle.age >= particle.life) game.particles.splice(i, 1);
  }
}

/**
 * Float the "No." bubbles and drop them when they expire.
 * @param {number} dt
 */
function updateBubbles(dt) {
  for (let i = game.bubbles.length - 1; i >= 0; i--) {
    const bubble = game.bubbles[i];
    bubble.age += dt;
    if (bubble.merchant) {
      bubble.x = bubble.merchant.x;
      bubble.y = bubble.merchant.y;
    }
    if (bubble.age >= bubble.life) game.bubbles.splice(i, 1);
  }
}

/**
 * Advance and retire table-flip time rewards.
 * @param {number} dt
 */
function updateTimeBursts(dt) {
  for (let i = game.timeBursts.length - 1; i >= 0; i--) {
    game.timeBursts[i].age += dt;
    if (game.timeBursts[i].age >= game.timeBursts[i].life) game.timeBursts.splice(i, 1);
  }
}

/**
 * Reveal, expire, or collect the wave-five sneaker.
 * @param {number} dt
 */
function updateSneakerPickup(dt) {
  const pickup = game.sneaker;
  if (!pickup) return;
  if (pickup.delay > 0) {
    pickup.delay = Math.max(0, pickup.delay - dt);
    return;
  }
  pickup.time -= dt;
  if (dist(game.player.x, game.player.y, pickup.x, pickup.y) < 34) {
    game.player.sneakers = true;
    game.sneaker = null;
    game.speedFlash = SPEED_FLASH_TIME;
    game.shake = 9;
    playCoinSplash();
    playSfx('wave', { volume: 0.5, rate: 1.18 });
    return;
  }
  if (pickup.time <= 0) game.sneaker = null;
}

/**
 * True once every table in the wave has finished falling.
 * @returns {boolean}
 */
function waveIsClear() {
  if (game.tables.length === 0) return false;
  for (const table of game.tables) {
    if (!table.flipped || table.anim < FLIP_ANIM) return false;
  }
  return true;
}

/**
 * Bank the wave bonus, advance the wave, and spawn that many tables.
 */
function beginNextWave() {
  game.time += BONUS;
  game.wave += 1;
  setCourtSize(game.wave);
  game.banner = BANNER_TIME;
  game.bannerSub = game.wave + (game.wave === 1 ? ' table' : ' tables');
  game.shake = 14;
  if (game.wave === 6 && !game.sneakerAwarded) {
    game.sneaker = {
      x: (FLOOR.l + FLOOR.r) / 2,
      y: (FLOOR.t + FLOOR.b) / 2,
      delay: BANNER_TIME,
      time: 5,
    };
    game.sneakerAwarded = true;
  }
  spawnWave(game.wave);
  playSfx('wave', { volume: 0.55, rate: 0.92 });
}

/**
 * Step the mode we're in. The clock runs only during play.
 * @param {number} dt
 */
function update(dt) {
  if (game.mode === 'title') {
    game.player.bob += dt * 2.2;
    return;
  }
  if (game.mode === 'over') {
    updateParticles(dt);
    updateBubbles(dt);
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 22);
    return;
  }
  updatePlayer(dt);
  updateSneakerPickup(dt);
  updateTables(dt);
  for (const merchant of game.merchants) updateMerchant(merchant, dt);
  updateParticles(dt);
  updateBubbles(dt);
  updateTimeBursts(dt);
  if (game.speedFlash > 0) game.speedFlash = Math.max(0, game.speedFlash - dt);
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 22);
  if (game.banner > 0) game.banner = Math.max(0, game.banner - dt);
  if (waveIsClear()) beginNextWave();
  game.time -= dt;
  if (game.time <= 0) {
    game.time = 0;
    endRun();
  }
}

/**
 * Rounded rectangle path. Does not fill or stroke.
 * @param {number} x
 * @param {number} y
 * @param {number} w
 * @param {number} h
 * @param {number} r
 */
function roundRect(x, y, w, h, r) {
  const radius = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
}

/**
 * Fill one line of text.
 * @param {string} value
 * @param {number} x
 * @param {number} y
 * @param {string} font
 * @param {string} color
 * @param {CanvasTextAlign} align
 * @param {CanvasTextBaseline} baseline
 */
function label(value, x, y, font, color, align, baseline) {
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = baseline || 'top';
  ctx.fillText(value, x, y);
}

/**
 * Draw centered text with deliberate letter spacing.
 * @param {string} value
 * @param {number} x
 * @param {number} y
 * @param {string} font
 * @param {string} color
 * @param {number} spacing
 */
function trackedLabel(value, x, y, font, color, spacing) {
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  let width = spacing * Math.max(0, value.length - 1);
  for (let i = 0; i < value.length; i++) width += ctx.measureText(value[i]).width;
  let at = x - width / 2;
  for (let i = 0; i < value.length; i++) {
    ctx.fillText(value[i], at, y);
    at += ctx.measureText(value[i]).width + spacing;
  }
}

/**
 * Gold halo crest sitting across the title-card border.
 * @param {number} x
 * @param {number} y
 */
function drawTitleCrest(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = '#f3cf70';
  ctx.lineCap = 'round';
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 29, Math.sin(a) * 29);
    ctx.lineTo(Math.cos(a) * 36, Math.sin(a) * 36);
    ctx.stroke();
  }
  ctx.fillStyle = '#24140e';
  ctx.beginPath();
  ctx.arc(0, 0, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(0, 1, 18, 6.5, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

/**
 * Dark glass panel used by the three HUD readouts.
 * @param {number} x
 * @param {number} y
 * @param {number} w
 * @param {number} h
 */
function hudPanel(x, y, w, h) {
  ctx.fillStyle = 'rgba(35, 18, 12, 0.76)';
  roundRect(x, y, w, h, 12);
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(255, 229, 162, 0.72)';
  ctx.stroke();
}

/**
 * Draw one local Lucide icon in a HUD panel.
 * @param {'table'|'wave'|'time'} kind
 * @param {number} x
 * @param {number} y
 */
function drawHudIcon(kind, x, y) {
  const image = HUD_ICONS[kind];
  if (!image || !image.complete || !image.naturalWidth) return;
  ctx.drawImage(image, x - 11, y - 11, 22, 22);
}

/**
 * Spinning gold blades behind a wave number.
 * @param {number} spin
 */
function drawBannerRays(spin) {
  ctx.save();
  ctx.rotate(spin);
  for (let i = 0; i < 18; i++) {
    ctx.rotate(Math.PI / 9);
    ctx.fillStyle = i % 2 === 0 ? 'rgba(226, 180, 74, 0.42)' : 'rgba(255, 244, 214, 0.16)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(22, 640);
    ctx.lineTo(-22, 640);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/**
 * Full-screen wave slam. Fades out while play continues.
 */
function drawBanner() {
  if (game.banner <= 0) return;
  const age = BANNER_TIME - game.banner;
  let alpha = 1;
  if (age < 0.08) alpha = age / 0.08;
  if (age > 1.15) alpha = Math.max(0, (BANNER_TIME - age) / (BANNER_TIME - 1.15));
  const punch = age < 0.22 ? 1.14 - (age / 0.22) * 0.14 : 1;
  const bounce = age >= 0.22 && age < 0.4 ? 1 + Math.sin(((age - 0.22) / 0.18) * Math.PI) * 0.06 : punch;

  ctx.save();
  ctx.globalAlpha = clamp(alpha, 0, 1) * 0.78;
  const dim = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, 520);
  dim.addColorStop(0, 'rgba(48, 18, 10, 0.2)');
  dim.addColorStop(1, 'rgba(12, 6, 4, 0.92)');
  ctx.fillStyle = dim;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  if (age < 0.16) {
    ctx.save();
    ctx.globalAlpha = (1 - age / 0.16) * 0.9;
    ctx.fillStyle = '#fff4cc';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  const ring = Math.min(age / 0.5, 1);
  if (ring < 1) {
    ctx.save();
    ctx.globalAlpha = (1 - ring) * clamp(alpha, 0, 1);
    ctx.strokeStyle = '#ffe7a8';
    ctx.lineWidth = 10 * (1 - ring);
    ctx.beginPath();
    ctx.arc(W / 2, H / 2 + 8, 30 + ring * 460, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.translate(W / 2, H / 2 + 6);
  ctx.scale(bounce, bounce);
  drawBannerRays(performance.now() / 700);
  ctx.fillStyle = 'rgba(48, 18, 12, 0.88)';
  ctx.beginPath();
  ctx.arc(0, 16, 168, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#e2b44a';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.arc(0, 16, 158, 0, Math.PI * 2);
  ctx.stroke();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#fff1c2';
  ctx.beginPath();
  ctx.arc(0, 16, 174, 0, Math.PI * 2);
  ctx.stroke();
  label('WAVE', 0, -58, '700 36px ' + NUM, '#ffe7a8', 'center', 'middle');
  ctx.shadowColor = 'rgba(62, 18, 8, 0.45)';
  ctx.shadowOffsetY = 4;
  label(String(game.wave), 0, 22, '700 112px ' + NUM, '#fff8ea', 'center', 'middle');
  ctx.shadowOffsetY = 0;
  label(game.bannerSub, 0, 96, '700 22px ' + NUM, '#fff6e8', 'center', 'middle');
  ctx.restore();
}

/**
 * Score, clock, and wave number during a run.
 */
function drawHud() {
  ctx.save();
  const top = 14;
  hudPanel(18, top, 190, 58);
  hudPanel(W / 2 - 95, top, 190, 58);
  hudPanel(W - 208, top, 190, 58);
  drawHudIcon('table', 42, top + 31);
  drawHudIcon('wave', W / 2 - 70, top + 31);
  drawHudIcon('time', W - 182, top + 31);

  ctx.shadowColor = 'rgba(20, 8, 4, 0.55)';
  ctx.shadowOffsetY = 2;
  const score = String(game.score);
  let tablesLeft = 0;
  for (let i = 0; i < game.tables.length; i++) {
    if (!game.tables[i].flipped) tablesLeft += 1;
  }
  label('TABLES FLIPPED', 62, top + 10, '700 10px ' + FONT, '#e9c878', 'left', 'top');
  label(score, 62, top + 25, '700 26px ' + NUM, '#fff9ed', 'left', 'top');

  const urgent = game.time < 10;
  const color = urgent ? '#ff6c50' : '#fff6e8';
  if (urgent) ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(performance.now() / 140));
  label('TIME', W - 38, top + 10, '700 11px ' + FONT, '#e9c878', 'right', 'top');
  label(Math.max(0, game.time).toFixed(1), W - 38, top + 25, '700 25px ' + NUM, color, 'right', 'top');
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255, 229, 162, 0.32)';
  ctx.fillRect(W / 2 + 5, top + 10, 1, 38);
  label('WAVE', W / 2 - 30, top + 10, '700 10px ' + FONT, '#e9c878', 'center', 'top');
  label(String(game.wave), W / 2 - 30, top + 25, '700 24px ' + NUM, '#fff9ed', 'center', 'top');
  label('LEFT', W / 2 + 45, top + 10, '700 10px ' + FONT, '#e9c878', 'center', 'top');
  label(String(tablesLeft), W / 2 + 45, top + 25, '700 24px ' + NUM, '#fff9ed', 'center', 'top');
  ctx.restore();
}

/**
 * Cinematic title treatment laid directly over the temple.
 */

/** Camera basis and view-projection for this frame. */
let cam = null;
/** View-projection matrix, column-major. */
let vp = new Float32Array(16);
let glFailed = false;
let prog = null;
let locMvp = null;
let locLight = null;
let meshBuf = null;
/** Triangle soup built each frame: x,y,z,r,g,b. */
const scratch = [];
/** Current model matrix. */
let model = null;
const modelStack = [];
const colorCache = {};
const LIGHT = [0.22, 0.9, 0.38];

const VS_SRC = [
  'attribute vec3 aPos;',
  'attribute vec3 aNormal;',
  'attribute vec3 aColor;',
  'uniform mat4 uMvp;',
  'varying vec3 vNormal;',
  'varying vec3 vColor;',
  'void main() {',
  '  gl_Position = uMvp * vec4(aPos, 1.0);',
  '  vNormal = aNormal;',
  '  vColor = aColor;',
  '}',
].join('\n');

const FS_SRC = [
  'precision mediump float;',
  'varying vec3 vNormal;',
  'varying vec3 vColor;',
  'uniform vec3 uLight;',
  'void main() {',
  '  float len = length(vNormal);',
  '  if (len < 0.001) {',
  '    gl_FragColor = vec4(vColor, 1.0);',
  '    return;',
  '  }',
  '  float nd = max(0.0, dot(vNormal / len, uLight));',
  '  float band = 0.72;',
  '  if (nd > 0.38) band = 0.88;',
  '  if (nd > 0.78) band = 1.0;',
  '  gl_FragColor = vec4(vColor * band, 1.0);',
  '}',
].join('\n');

/**
 * Identity matrix, column-major.
 * @returns {Float32Array}
 */
function ident() {
  const m = new Float32Array(16);
  m[0] = m[5] = m[10] = m[15] = 1;
  return m;
}

/**
 * Multiply two column-major matrices.
 * @param {Float32Array} a
 * @param {Float32Array} b
 * @returns {Float32Array}
 */
function mul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) {
    for (let r = 0; r < 4; r++) {
      o[c * 4 + r] =
        a[r] * b[c * 4] +
        a[4 + r] * b[c * 4 + 1] +
        a[8 + r] * b[c * 4 + 2] +
        a[12 + r] * b[c * 4 + 3];
    }
  }
  return o;
}

/**
 * Translation matrix.
 * @param {number} x
 * @param {number} y
 * @param {number} z
 * @returns {Float32Array}
 */
function matTranslate(x, y, z) {
  const m = ident();
  m[12] = x;
  m[13] = y;
  m[14] = z;
  return m;
}

/**
 * Scale from the local origin. Feet stay put when this sits above the ground.
 * @param {number} x
 * @param {number} y
 * @param {number} z
 * @returns {Float32Array}
 */
function matScale(x, y, z) {
  const m = ident();
  m[0] = x;
  m[5] = y;
  m[10] = z;
  return m;
}

/**
 * Rotation around Y, column-major.
 * @param {number} a Radians.
 * @returns {Float32Array}
 */
function matRotateY(a) {
  const c = Math.cos(a);
  const s = Math.sin(a);
  const m = ident();
  m[0] = c;
  m[2] = -s;
  m[8] = s;
  m[10] = c;
  return m;
}

/**
 * Rotation around X, column-major.
 * @param {number} a Radians.
 * @returns {Float32Array}
 */
function matRotateX(a) {
  const c = Math.cos(a);
  const s = Math.sin(a);
  const m = ident();
  m[5] = c;
  m[6] = s;
  m[9] = -s;
  m[10] = c;
  return m;
}

/**
 * Rotation around Z, column-major.
 * @param {number} a Radians.
 * @returns {Float32Array}
 */
function matRotateZ(a) {
  const c = Math.cos(a);
  const s = Math.sin(a);
  const m = ident();
  m[0] = c;
  m[1] = s;
  m[4] = -s;
  m[5] = c;
  return m;
}

/**
 * Push a copy of the model matrix.
 */
function pushModel() {
  modelStack.push(model);
  model = model.slice();
}

/**
 * Restore the model matrix.
 */
function popModel() {
  model = modelStack.pop() || ident();
}

/**
 * Multiply a matrix onto the model.
 * @param {Float32Array} mat
 */
function apply(mat) {
  model = mul(model, mat);
}

/**
 * Parse a #rrggbb color, cached.
 * @param {string} hexColor
 * @returns {number[]}
 */
function rgb(hexColor) {
  const cached = colorCache[hexColor];
  if (cached) return cached;
  const n = hexColor.charAt(0) === '#' ? hexColor.slice(1) : hexColor;
  const out = [
    parseInt(n.slice(0, 2), 16) / 255,
    parseInt(n.slice(2, 4), 16) / 255,
    parseInt(n.slice(4, 6), 16) / 255,
  ];
  colorCache[hexColor] = out;
  return out;
}

/**
 * Transform a local point by the model matrix.
 * @param {number[]} p
 * @returns {number[]}
 */
function xform(p) {
  const x = p[0];
  const y = p[1];
  const z = p[2];
  const m = model;
  return [
    m[0] * x + m[4] * y + m[8] * z + m[12],
    m[1] * x + m[5] * y + m[9] * z + m[13],
    m[2] * x + m[6] * y + m[10] * z + m[14],
  ];
}

/** Sky, clouds, and shadows skip lighting. */
let unlit = false;

/**
 * Rotate a direction by the model matrix, ignoring translation.
 * @param {number[]} n
 * @returns {number[]}
 */
function xformDir(n) {
  const m = model;
  return [
    m[0] * n[0] + m[4] * n[1] + m[8] * n[2],
    m[1] * n[0] + m[5] * n[1] + m[9] * n[2],
    m[2] * n[0] + m[6] * n[1] + m[10] * n[2],
  ];
}

/**
 * Write a world-space vertex. A zero normal stays unshaded, for the sky.
 * @param {number[]} p
 * @param {number[]} n
 * @param {number[]} col
 */
function pushWorld(p, n, col) {
  if (unlit) {
    scratch.push(p[0], p[1], p[2], 0, 0, 0, col[0], col[1], col[2]);
    return;
  }
  const len = Math.hypot(n[0], n[1], n[2]) || 1;
  scratch.push(p[0], p[1], p[2], n[0] / len, n[1] / len, n[2] / len, col[0], col[1], col[2]);
}

/**
 * Emit one triangle from local-space corners, flat across the face.
 * @param {number[]} a
 * @param {number[]} b
 * @param {number[]} c
 * @param {number[]} rgbv
 */
function localTri(a, b, c, rgbv) {
  const pa = xform(a);
  const pb = xform(b);
  const pc = xform(c);
  const ux = pb[0] - pa[0];
  const uy = pb[1] - pa[1];
  const uz = pb[2] - pa[2];
  const vx = pc[0] - pa[0];
  const vy = pc[1] - pa[1];
  const vz = pc[2] - pa[2];
  const normal = [uy * vz - uz * vy, uz * vx - ux * vz, ux * vy - uy * vx];
  pushWorld(pa, normal, rgbv);
  pushWorld(pb, normal, rgbv);
  pushWorld(pc, normal, rgbv);
}

/**
 * Emit one smoothly shaded vertex.
 * @param {number[]} p Local position.
 * @param {number[]} n Local normal.
 * @param {number[]} rgbv
 */
function emitSmooth(p, n, rgbv) {
  pushWorld(xform(p), xformDir(n), rgbv);
}

/**
 * Axis-aligned box centered on the local origin.
 * @param {number} w
 * @param {number} h
 * @param {number} d
 * @param {string} color
 */
function cube(w, h, d, color) {
  const rgbv = rgb(color);
  const x = w / 2;
  const y = h / 2;
  const z = d / 2;
  const v = [
    [-x, -y, -z], [x, -y, -z], [x, y, -z], [-x, y, -z],
    [-x, -y, z], [x, -y, z], [x, y, z], [-x, y, z],
  ];
  const faces = [
    [4, 5, 6, 7],
    [1, 0, 3, 2],
    [5, 1, 2, 6],
    [0, 4, 7, 3],
    [3, 7, 6, 2],
    [0, 1, 5, 4],
  ];
  for (let i = 0; i < faces.length; i++) {
    const f = faces[i];
    localTri(v[f[0]], v[f[1]], v[f[2]], rgbv);
    localTri(v[f[0]], v[f[2]], v[f[3]], rgbv);
  }
}

/**
 * Vertical prism centered on the local origin. Used for columns, coins, and the halo.
 * @param {number} radius
 * @param {number} height
 * @param {number} sides
 * @param {string} color
 */
function prism(radius, height, sides, color) {
  const rgbv = rgb(color);
  const hy = height / 2;
  const top = [];
  const bot = [];
  for (let i = 0; i < sides; i++) {
    const a = (i / sides) * Math.PI * 2;
    const cx = Math.cos(a) * radius;
    const cz = Math.sin(a) * radius;
    top.push([cx, hy, cz]);
    bot.push([cx, -hy, cz]);
  }
  for (let i = 1; i < sides - 1; i++) {
    localTri(top[0], top[i], top[i + 1], rgbv);
    localTri(bot[0], bot[i + 1], bot[i], rgbv);
  }
  for (let i = 0; i < sides; i++) {
    const j = (i + 1) % sides;
    const a0 = (i / sides) * Math.PI * 2;
    const a1 = (j / sides) * Math.PI * 2;
    const n0 = [Math.cos(a0), 0, Math.sin(a0)];
    const n1 = [Math.cos(a1), 0, Math.sin(a1)];
    emitSmooth(bot[i], n0, rgbv);
    emitSmooth(bot[j], n1, rgbv);
    emitSmooth(top[j], n1, rgbv);
    emitSmooth(bot[i], n0, rgbv);
    emitSmooth(top[j], n1, rgbv);
    emitSmooth(top[i], n0, rgbv);
  }
}

/**
 * Emit a triangle whose winding faces away from the local origin.
 * @param {number[]} a
 * @param {number[]} b
 * @param {number[]} c
 * @param {number[]} rgbv
 */
function emitOutward(a, b, c, rgbv) {
  const ux = b[0] - a[0];
  const uy = b[1] - a[1];
  const uz = b[2] - a[2];
  const vx = c[0] - a[0];
  const vy = c[1] - a[1];
  const vz = c[2] - a[2];
  const nx = uy * vz - uz * vy;
  const ny = uz * vx - ux * vz;
  const nz = ux * vy - uy * vx;
  const mx = (a[0] + b[0] + c[0]) / 3;
  const my = (a[1] + b[1] + c[1]) / 3;
  const mz = (a[2] + b[2] + c[2]) / 3;
  if (nx * mx + ny * my + nz * mz < 0) localTri(a, c, b, rgbv);
  else localTri(a, b, c, rgbv);
}

/**
 * Smooth ellipsoid centered on the local origin.
 * @param {number} rx
 * @param {number} ry
 * @param {number} rz
 * @param {string} color
 */
function ellipsoid(rx, ry, rz, color) {
  const rgbv = rgb(color);
  const stacks = 8;
  const slices = 18;
  /**
   * One point on the ellipsoid and its outward normal.
   * @param {number} i
   * @param {number} j
   * @returns {{p:number[],n:number[]}}
   */
  function point(i, j) {
    const v = (i / stacks) * Math.PI;
    const u = (j / slices) * Math.PI * 2;
    const sy = Math.sin(v);
    const cy = Math.cos(v);
    const p = [Math.cos(u) * sy * rx, cy * ry, Math.sin(u) * sy * rz];
    return { p: p, n: [p[0] / (rx * rx) || 0, p[1] / (ry * ry) || 0, p[2] / (rz * rz) || 0] };
  }
  for (let i = 0; i < stacks; i++) {
    for (let j = 0; j < slices; j++) {
      const a = point(i, j);
      const b = point(i, j + 1);
      const c = point(i + 1, j + 1);
      const d = point(i + 1, j);
      emitSmooth(a.p, a.n, rgbv);
      emitSmooth(b.p, b.n, rgbv);
      emitSmooth(c.p, c.n, rgbv);
      emitSmooth(a.p, a.n, rgbv);
      emitSmooth(c.p, c.n, rgbv);
      emitSmooth(d.p, d.n, rgbv);
    }
  }
}

/**
 * Rounded frustum, wider at the bottom. Centered on the local origin.
 * @param {number} rBot
 * @param {number} rTop
 * @param {number} height
 * @param {number} sides
 * @param {string} color
 */
function taper(rBot, rTop, height, sides, color) {
  const rgbv = rgb(color);
  const hy = height / 2;
  const top = [];
  const bot = [];
  for (let i = 0; i < sides; i++) {
    const a = (i / sides) * Math.PI * 2;
    const c = Math.cos(a);
    const s = Math.sin(a);
    top.push([c * rTop, hy, s * rTop]);
    bot.push([c * rBot, -hy, s * rBot]);
  }
  for (let i = 1; i < sides - 1; i++) {
    emitOutward(top[0], top[i], top[i + 1], rgbv);
    emitOutward(bot[0], bot[i + 1], bot[i], rgbv);
  }
  for (let i = 0; i < sides; i++) {
    const j = (i + 1) % sides;
    const a0 = (i / sides) * Math.PI * 2;
    const a1 = (j / sides) * Math.PI * 2;
    const dr = (rTop - rBot) / height;
    const n0 = [Math.cos(a0), -dr, Math.sin(a0)];
    const n1 = [Math.cos(a1), -dr, Math.sin(a1)];
    emitSmooth(bot[i], n0, rgbv);
    emitSmooth(bot[j], n1, rgbv);
    emitSmooth(top[j], n1, rgbv);
    emitSmooth(bot[i], n0, rgbv);
    emitSmooth(top[j], n1, rgbv);
    emitSmooth(top[i], n0, rgbv);
  }
}

/**
 * Compile shaders and the mesh program.
 */
function initGL() {
  gl = view.getContext('webgl', { antialias: true, alpha: false });
  if (!gl) {
    glFailed = true;
    return;
  }
  /**
   * Compile one shader.
   * @param {number} type
   * @param {string} src
   * @returns {WebGLShader}
   */
  function shader(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    return sh;
  }
  const vs = shader(gl.VERTEX_SHADER, VS_SRC);
  const fs = shader(gl.FRAGMENT_SHADER, FS_SRC);
  prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.bindAttribLocation(prog, 0, 'aPos');
  gl.bindAttribLocation(prog, 1, 'aNormal');
  gl.bindAttribLocation(prog, 2, 'aColor');
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    glFailed = true;
    return;
  }
  locMvp = gl.getUniformLocation(prog, 'uMvp');
  locLight = gl.getUniformLocation(prog, 'uLight');
  meshBuf = gl.createBuffer();
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.42, 0.74, 0.9, 1);
  const llen = Math.hypot(LIGHT[0], LIGHT[1], LIGHT[2]);
  LIGHT[0] /= llen;
  LIGHT[1] /= llen;
  LIGHT[2] /= llen;
}

/**
 * How far the shoulder camera can sit before it leaves the court.
 * 1 is the full distance. Smaller means it has to move in.
 * @param {number} ex
 * @param {number} ez
 * @param {number} px
 * @param {number} pz
 * @returns {number}
 */
function cameraRoomScale(ex, ez, px, pz) {
  const minX = FLOOR.l - 22;
  const maxX = FLOOR.r + 22;
  const minZ = FLOOR.t - 32;
  const maxZ = FLOOR.b + 80;
  let scale = 1;
  const ox = ex - px;
  const oz = ez - pz;
  if (ox > 1) scale = Math.min(scale, (maxX - px) / ox);
  else if (ox < -1) scale = Math.min(scale, (minX - px) / ox);
  if (oz > 1) scale = Math.min(scale, (maxZ - pz) / oz);
  else if (oz < -1) scale = Math.min(scale, (minZ - pz) / oz);
  return clamp(scale, 0.34, 1);
}

/**
 * Sit behind the player's right shoulder and look ahead of them.
 * The rig eases after the player, and the distance eases when a wall gets close.
 */
function updateCamera() {
  const p = game.player;
  const now = performance.now();
  const dt = camStamp ? Math.min(0.05, (now - camStamp) / 1000) : 0.016;
  camStamp = now;
  const yawGap = wrapAngle(p.yaw - camYaw);
  camYaw = wrapAngle(camYaw + yawGap * (1 - Math.exp(-CAM_YAW * dt)));
  const follow = 1 - Math.exp(-CAM_FOLLOW * dt);
  camX += (p.x - camX) * follow;
  camZ += (p.y - camZ) * follow;

  const shake = game.shake > 0.2 ? game.shake : 0;
  const k = now / 32;
  const hx = Math.sin(camYaw);
  const hz = Math.cos(camYaw);
  const sx = -hz;
  const sz = hx;
  const ox = -hx * CAM_BACK + sx * CAM_SHOULDER;
  const oz = -hz * CAM_BACK + sz * CAM_SHOULDER;
  const want = cameraRoomScale(camX + ox, camZ + oz, camX, camZ);
  const rate = want < camPull ? 9 : 3.2;
  camPull += (want - camPull) * (1 - Math.exp(-rate * dt));
  const ex = camX + ox * camPull + Math.sin(k * 1.7) * shake;
  const ez = camZ + oz * camPull + Math.cos(k * 1.3) * shake * 0.35;
  const ey = GROUND + CAM_HEIGHT * (0.7 + 0.3 * camPull) + Math.cos(k * 2.1) * shake * 0.25;
  const tx = camX + hx * CAM_AHEAD + sx * 14;
  const ty = GROUND + CAM_LOOK_H;
  const tz = camZ + hz * CAM_AHEAD + sz * 14;
  let fx = tx - ex;
  let fy = ty - ey;
  let fz = tz - ez;
  const fl = Math.hypot(fx, fy, fz) || 1;
  fx /= fl;
  fy /= fl;
  fz /= fl;
  let rx = -fz;
  let ry = 0;
  let rz = fx;
  const rl = Math.hypot(rx, ry, rz) || 1;
  rx /= rl;
  ry /= rl;
  rz /= rl;
  const ux = ry * fz - rz * fy;
  const uy = rz * fx - rx * fz;
  const uz = rx * fy - ry * fx;
  cam = { ex: ex, ey: ey, ez: ez, fx: fx, fy: fy, fz: fz, rx: rx, ry: ry, rz: rz, ux: ux, uy: uy, uz: uz };

  const viewM = ident();
  viewM[0] = rx;
  viewM[1] = ux;
  viewM[2] = -fx;
  viewM[4] = ry;
  viewM[5] = uy;
  viewM[6] = -fy;
  viewM[8] = rz;
  viewM[9] = uz;
  viewM[10] = -fz;
  viewM[12] = -(rx * ex + ry * ey + rz * ez);
  viewM[13] = -(ux * ex + uy * ey + uz * ez);
  viewM[14] = fx * ex + fy * ey + fz * ez;

  const f = 1 / Math.tan(CAM_FOV / 2);
  const aspect = W / H;
  const near = 12;
  const far = 5000;
  const proj = ident();
  proj[0] = f / aspect;
  proj[5] = f;
  proj[10] = (far + near) / (near - far);
  proj[11] = -1;
  proj[14] = (2 * far * near) / (near - far);
  proj[15] = 0;
  vp = mul(proj, viewM);
}

/**
 * Project a world point to logical screen pixels.
 * @param {number} x
 * @param {number} y
 * @param {number} z
 * @returns {{x:number,y:number} | null}
 */
function projectToScreen(x, y, z) {
  const cx = vp[0] * x + vp[4] * y + vp[8] * z + vp[12];
  const cy = vp[1] * x + vp[5] * y + vp[9] * z + vp[13];
  const cw = vp[3] * x + vp[7] * y + vp[11] * z + vp[15];
  if (cw <= 0.05) return null;
  return {
    x: (cx / cw * 0.5 + 0.5) * W,
    y: (1 - (cy / cw * 0.5 + 0.5)) * H,
  };
}

/**
 * Upload the frame mesh and draw it.
 */
function flushMesh() {
  if (!gl || !scratch.length) return;
  gl.useProgram(prog);
  gl.uniformMatrix4fv(locMvp, false, vp);
  gl.uniform3fv(locLight, LIGHT);
  gl.bindBuffer(gl.ARRAY_BUFFER, meshBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(scratch), gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.enableVertexAttribArray(1);
  gl.enableVertexAttribArray(2);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 36, 0);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 36, 12);
  gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 36, 24);
  gl.drawArrays(gl.TRIANGLES, 0, scratch.length / 9);
}

/**
 * Flat contact shadow on the ground. Call in local space at the feet.
 * @param {number} rx
 * @param {number} rz
 */
function footShadow(rx, rz) {
  unlit = true;
  pushModel();
  apply(matTranslate(0, 0.5, 0));
  ellipsoid(rx, 0.45, rz, '#c4a882');
  popModel();
  unlit = false;
}

/**
 * Stable 0–1 value for scenery placed once around the court.
 * @param {number} n
 * @returns {number}
 */
function sceneryRand(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

/**
 * Push one already-world-space vertex.
 * @param {number} x
 * @param {number} y
 * @param {number} z
 * @param {number[]} col
 */
function pushVert(x, y, z, col) {
  scratch.push(x, y, z, 0, 0, 0, col[0], col[1], col[2]);
}

/**
 * Sky cylinder around the camera, warm at the horizon and blue overhead.
 */
function drawSky() {
  const cx = cam.ex;
  const cz = cam.ez;
  const radius = 3100;
  const segs = 22;
  const stops = [
    { y: -40, color: rgb('#f3d7a4') },
    { y: 90, color: rgb('#f7e6bc') },
    { y: 200, color: rgb('#d5eefb') },
    { y: 380, color: rgb('#8ecae8') },
    { y: 640, color: rgb('#4aa3d8') },
    { y: 1000, color: rgb('#2f86c4') },
  ];
  for (let b = 0; b < stops.length - 1; b++) {
    const y0 = stops[b].y;
    const y1 = stops[b + 1].y;
    const c0 = stops[b].color;
    const c1 = stops[b + 1].color;
    for (let i = 0; i < segs; i++) {
      const a0 = (i / segs) * Math.PI * 2;
      const a1 = ((i + 1) / segs) * Math.PI * 2;
      const x0 = cx + Math.cos(a0) * radius;
      const z0 = cz + Math.sin(a0) * radius;
      const x1 = cx + Math.cos(a1) * radius;
      const z1 = cz + Math.sin(a1) * radius;
      pushVert(x0, y0, z0, c0);
      pushVert(x1, y0, z1, c0);
      pushVert(x1, y1, z1, c1);
      pushVert(x0, y0, z0, c0);
      pushVert(x1, y1, z1, c1);
      pushVert(x0, y1, z0, c1);
    }
  }
}

/**
 * Sunlit plain under the horizon. Follows the camera so the edge never shows.
 */
function drawCountry() {
  const cx = cam.ex;
  const cz = cam.ez;
  const radius = 3000;
  const segs = 28;
  const y = -2;
  const tint = rgb('#e4c56b');
  for (let i = 0; i < segs; i++) {
    const a0 = (i / segs) * Math.PI * 2;
    const a1 = ((i + 1) / segs) * Math.PI * 2;
    pushVert(cx, y, cz, tint);
    pushVert(cx + Math.cos(a0) * radius, y, cz + Math.sin(a0) * radius, tint);
    pushVert(cx + Math.cos(a1) * radius, y, cz + Math.sin(a1) * radius, tint);
  }
}

/**
 * A tall, narrow cypress. Two cones so the silhouette stays pointed.
 * @param {number} x
 * @param {number} z
 * @param {number} height
 */
function drawCypress(x, z, height) {
  const slim = Math.max(6, height * 0.085);
  pushModel();
  apply(matTranslate(x, 0, z));
  pushModel();
  apply(matTranslate(0, 3, 0));
  taper(2.2, 1.5, 6, 8, '#6a4630');
  popModel();
  pushModel();
  apply(matTranslate(0, 6 + height * 0.5, 0));
  taper(slim, height * 0.012, height, 16, '#1e5636');
  popModel();
  pushModel();
  apply(matTranslate(0, 10 + height * 0.4, 0));
  taper(slim * 0.62, height * 0.008, height * 0.78, 14, '#32784a');
  popModel();
  popModel();
}

/**
 * A small ancient stone house or a broken ruin, with a door and columns.
 * @param {number} x
 * @param {number} z
 * @param {number} yaw
 * @param {number} w
 * @param {number} d
 * @param {number} h
 * @param {boolean} ruined
 */
function drawStoneHouse(x, z, yaw, w, d, h, ruined) {
  const wallH = ruined ? h * 0.58 : h;
  pushModel();
  apply(matTranslate(x, 0, z));
  apply(matRotateY(yaw));
  pushModel();
  apply(matTranslate(0, 4, 0));
  cube(w + 16, 8, d + 12, '#cbb892');
  popModel();
  pushModel();
  apply(matTranslate(0, 8 + wallH / 2, 0));
  cube(w, wallH, d, ruined ? '#d9c7a6' : '#e7d6b6');
  popModel();
  if (!ruined) {
    pushModel();
    apply(matTranslate(0, 8 + h + 3.5, 0));
    cube(w + 8, 7, d + 6, '#b7a07e');
    popModel();
  }
  pushModel();
  apply(matTranslate(0, 8 + wallH * 0.28, d / 2));
  cube(Math.min(16, w * 0.28), wallH * 0.48, 4, '#8a7054');
  popModel();
  const span = w * 0.34;
  for (let s = -1; s <= 1; s += 2) {
    if (ruined && s > 0) continue;
    pushModel();
    apply(matTranslate(s * span, 8 + wallH * 0.42, d / 2 + 5));
    prism(3.4, wallH * 0.84, 14, '#f4ead8');
    popModel();
  }
  popModel();
}

/**
 * Whether scenery is safely beyond the expanding temple.
 * @param {number} x
 * @param {number} z
 * @param {number} margin
 * @returns {boolean}
 */
function beyondCourt(x, z, margin) {
  return x < FLOOR.l - margin || x > FLOOR.r + margin ||
    z < FLOOR.t - margin || z > FLOOR.b + margin;
}

/**
 * Country around the temple: cypress trees and old stone houses.
 */
function drawScenery() {
  drawSky();
  drawCountry();
  drawClouds();
  drawSun();
  const houses = [
    [1320, 160, 0.5, 96, 70, 62, false],
    [1500, 420, -0.4, 72, 54, 46, true],
    [1160, 20, 0.15, 64, 48, 40, false],
    [-260, 180, 2.4, 88, 62, 58, false],
    [-400, 460, 1.2, 60, 46, 34, true],
    [240, 1020, -2.8, 80, 58, 48, false],
    [820, 1100, 2.7, 92, 66, 54, true],
    [1680, -80, -0.7, 110, 74, 72, false],
  ];
  for (let i = 0; i < houses.length; i++) {
    const h = houses[i];
    if (!beyondCourt(h[0], h[1], 150)) continue;
    drawStoneHouse(h[0], h[1], h[2], h[3], h[4], h[5], h[6]);
  }
  const grove = [
    [1180, 240, 120], [1260, 300, 90], [1400, 220, 140], [1460, 340, 80],
    [-180, 250, 130], [-300, 320, 100], [-360, 160, 150],
    [180, 920, 110], [320, 980, 85], [700, 1000, 125], [900, 1040, 95],
    [1580, 60, 135], [1740, 40, 100], [1600, 200, 80],
    [1100, 560, 115], [-120, 640, 90],
  ];
  for (let i = 0; i < grove.length; i++) {
    const g = grove[i];
    if (!beyondCourt(g[0], g[1], 100)) continue;
    drawCypress(g[0], g[1], g[2]);
  }
  for (let i = 0; i < 18; i++) {
    const a = sceneryRand(i + 3) * Math.PI * 2;
    const rad = 980 + sceneryRand(i + 17) * 620;
    const x = 480 + Math.cos(a) * rad;
    const z = 330 + Math.sin(a) * rad;
    if (!beyondCourt(x, z, 130)) continue;
    drawCypress(x, z, 60 + sceneryRand(i + 8) * 80);
  }
}

/**
 * Bright disc that stays facing the camera.
 */
function drawSun() {
  const sunX = 1680;
  const sunY = 460;
  const sunZ = -280;
  const yaw = Math.atan2(cam.ex - sunX, cam.ez - sunZ);
  unlit = true;
  pushModel();
  apply(matTranslate(sunX, sunY, sunZ));
  apply(matRotateY(yaw));
  apply(matRotateX(Math.PI / 2));
  prism(150, 8, 28, '#fff4c4');
  prism(78, 14, 28, '#ffe56a');
  popModel();
  unlit = false;
}

/**
 * A few flat clouds, far enough to drift slowly as the camera turns.
 */
function drawClouds() {
  const clouds = [
    [200, 620, -900, 280, 36, 90],
    [1100, 700, -600, 340, 32, 110],
    [-200, 760, 200, 260, 28, 80],
    [900, 680, 1400, 300, 30, 100],
    [1500, 740, 400, 220, 26, 70],
  ];
  unlit = true;
  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i];
    pushModel();
    apply(matTranslate(c[0], c[1], c[2]));
    cube(c[3], c[4], c[5], '#fffaf0');
    popModel();
  }
  unlit = false;
}

/**
 * Temple wall, colonnade, and the stone floor.
 */
function drawCourt3d() {
  const centerX = (FLOOR.l + FLOOR.r) / 2;
  const centerZ = (FLOOR.t + FLOOR.b) / 2;
  const width = FLOOR.r - FLOOR.l;
  const depth = FLOOR.b - FLOOR.t;
  const colZ = FLOOR.t - 74;
  pushModel();
  apply(matTranslate(centerX, 70, FLOOR.t - 150));
  cube(width + 380, 200, 50, '#6e3028');
  popModel();

  pushModel();
  apply(matTranslate(centerX, 1, centerZ));
  cube(width + 220, 4, depth + 180, '#a68462');
  popModel();

  pushModel();
  apply(matTranslate((FLOOR.l + FLOOR.r) / 2, 3, (FLOOR.t + FLOOR.b) / 2));
  cube(FLOOR.r - FLOOR.l, 4, FLOOR.b - FLOOR.t, '#c9a478');
  popModel();

  const tile = 46;
  for (let z = FLOOR.t; z < FLOOR.b - 2; z += tile) {
    for (let x = FLOOR.l; x < FLOOR.r - 2; x += tile) {
      const col = Math.round((x - FLOOR.l) / tile);
      const row = Math.round((z - FLOOR.t) / tile);
      const mark = (col * 5 + row * 3) % 11;
      let color = '#ddb68a';
      if (mark === 0) color = '#d2ac7c';
      else if ((col + row) % 2 === 0) color = '#e8c99c';
      const tw = Math.min(tile - 3, FLOOR.r - x);
      const td = Math.min(tile - 3, FLOOR.b - z);
      pushModel();
      apply(matTranslate(x + tw / 2, 6, z + td / 2));
      cube(tw, 4, td, color);
      popModel();
    }
  }

  for (let x = FLOOR.l - 6; x <= FLOOR.r + 10; x += 104) {
    pushModel();
    apply(matTranslate(x, 58, colZ));
    prism(16, 108, 20, '#f3e6d0');
    popModel();
    pushModel();
    apply(matTranslate(x, 116, colZ));
    prism(20, 12, 14, '#f7f0e4');
    popModel();
  }

  pushModel();
  apply(matTranslate(centerX, 128, colZ));
  cube(width + 180, 18, 52, '#8c4034');
  popModel();
  pushModel();
  apply(matTranslate(centerX, 140, colZ));
  cube(width + 190, 5, 58, '#e2b44a');
  popModel();
}

/**
 * Cracks and a dent on a table that has already been flipped.
 * Drawn in the table's local space.
 * @param {object} table
 * @param {object} scars
 */
function drawTableDamage(table, scars) {
  const dent = scars.dent;
  pushModel();
  apply(matTranslate(dent.x, 34.2, dent.z));
  ellipsoid(7, 1.1, 5.5, '#5c341c');
  popModel();
  pushModel();
  apply(matTranslate(dent.x + 4, 35.4, dent.z - 2));
  apply(matRotateZ(0.8));
  apply(matRotateY(0.4));
  cube(4.5, 1.3, 7, '#7a4a2a');
  popModel();
  for (let i = 0; i < scars.cracks.length; i++) {
    const crack = scars.cracks[i];
    pushModel();
    apply(matTranslate(crack.x, 34.7, crack.z));
    apply(matRotateY(crack.yaw));
    cube(crack.len, 0.7 + Math.min(scars.hits, 4) * 0.15, 1.2 + Math.min(scars.hits, 4) * 0.25, '#2c1a10');
    popModel();
    if (i === 0) {
      pushModel();
      apply(matTranslate(crack.x + 2, 34.7, crack.z + 3));
      apply(matRotateY(crack.yaw + 0.9));
      cube(crack.len * 0.55, 0.6, 1.1, '#2c1a10');
      popModel();
    }
  }
  pushModel();
  apply(matTranslate(table.w * 0.32, 31, 16));
  cube(6, 3, 4, '#6b4224');
  popModel();
  if (scars.hits >= 3) {
    pushModel();
    apply(matTranslate(-table.w * 0.15, 36, -4));
    apply(matRotateZ(0.5 + scars.hits * 0.08));
    cube(14, 2, 8, '#8d5a32');
    popModel();
  }
  if (scars.hits >= 5) {
    pushModel();
    apply(matTranslate(8, 32, 8));
    ellipsoid(6, 1.4, 5, '#3a2416');
    popModel();
  }
}

/**
 * One table, tumbling in place once it has been hit.
 * @param {object} table
 */
function drawTable3d(table) {
  const lift = tableLift(table);
  pushModel();
  apply(matTranslate(table.x, GROUND + lift, table.y));
  apply(matTranslate(0, 16, 0));
  apply(matRotateY(table.ry || 0));
  apply(matRotateX(table.rx || 0));
  apply(matRotateZ(table.rz || 0));
  apply(matTranslate(0, -16, 0));

  const hw = table.w / 2 - 8;
  const legs = [-hw, hw];
  const depths = [-16, 16];
  const scars = table.scars;
  for (let i = 0; i < legs.length; i++) {
    for (let j = 0; j < depths.length; j++) {
      const legId = i * 2 + j;
      const broken = scars && scars.legs.indexOf(legId) >= 0;
      const stump = broken && scars.hits >= 4 && scars.legs[0] === legId;
      pushModel();
      if (stump) {
        apply(matTranslate(legs[i], 4, depths[j]));
        prism(2.2, 6, 6, '#4a2e18');
      } else if (broken) {
        apply(matTranslate(legs[i], 9, depths[j]));
        apply(matRotateZ((legs[i] > 0 ? 0.7 : -0.7) + scars.hits * 0.08));
        prism(2.3, 14, 6, '#6b4224');
        pushModel();
        apply(matTranslate(3, -4, 2));
        apply(matRotateZ(-1.1));
        cube(2.2, 9, 2.2, '#4a2e18');
        popModel();
      } else {
        apply(matTranslate(legs[i], 14, depths[j]));
        prism(2.6, 28, 6, '#6b4224');
      }
      popModel();
    }
  }
  pushModel();
  apply(matTranslate(0, 30, 0));
  cube(table.w, 5, 44, scars ? '#8d5a32' : '#a56b32');
  popModel();
  if (scars && scars.hits >= 3) {
    pushModel();
    apply(matTranslate(-table.w * 0.22, 33.2, 0));
    cube(table.w * 0.4, 2.2, 30, '#b07848');
    popModel();
    pushModel();
    apply(matTranslate(table.w * 0.22, 33.6, 1));
    apply(matRotateZ(0.08 * Math.min(scars.hits, 6)));
    cube(Math.max(8, table.w * 0.34 - scars.hits), 2.2, 28, '#9a6840');
    popModel();
  } else {
    pushModel();
    apply(matTranslate(0, 33.2, 0));
    cube(table.w - 10, 2.2, 32, scars ? '#b07848' : '#c4894a');
    popModel();
  }
  if (scars) drawTableDamage(table, scars);
  const clothW = scars ? Math.max(8, table.w - 14 - scars.hits * 7) : table.w - 12;
  const clothH = scars ? Math.max(4, 15 - scars.hits * 2.5) : 16;
  pushModel();
  apply(matTranslate(scars ? -4 : 0, scars ? 16 : 20, 18));
  cube(clothW, clothH, 3, table.cloth);
  popModel();
  if (scars && scars.hits < 4) {
    pushModel();
    apply(matTranslate(table.w * 0.28, 12, 19));
    apply(matRotateX(0.55));
    cube(9, 12, 2.2, table.cloth);
    popModel();
  }
  const coinKeep = scars ? Math.max(0, table.coins.length - scars.hits) : table.coins.length;
  for (let i = 0; i < coinKeep; i++) {
    const coin = table.coins[i];
    pushModel();
    apply(matTranslate(coin.x, 37, coin.z || 0));
    prism(coin.r, 2.8, 8, '#f0c14a');
    popModel();
  }
  popModel();
}

/**
 * A flat sandal under the current origin: sole and two straps.
 * @param {number} radius
 */
function sandal(radius) {
  ellipsoid(radius * 1.45, 0.7, radius * 3.1, '#8d5a32');
  pushModel();
  apply(matTranslate(0, 1.05, radius * 1.15));
  ellipsoid(radius * 1.15, 0.32, 0.5, '#c4894a');
  popModel();
  pushModel();
  apply(matTranslate(0, 1, -radius * 0.15));
  ellipsoid(radius * 0.9, 0.28, 0.42, '#c4894a');
  popModel();
}

/**
 * Bright low-poly sneaker under the current origin.
 * @param {number} radius
 */
function sneaker(radius) {
  pushModel();
  apply(matTranslate(0, 0.15, radius * 0.25));
  ellipsoid(radius * 1.55, 0.78, radius * 3.3, '#fff8df');
  popModel();
  pushModel();
  apply(matTranslate(0, 1.15, radius * 0.15));
  ellipsoid(radius * 1.32, radius * 0.9, radius * 2.25, '#f4c934');
  popModel();
  pushModel();
  apply(matTranslate(0, 2.05, -radius * 1.1));
  taper(radius * 1.2, radius * 0.85, radius * 1.8, 14, '#e8b921');
  popModel();
  pushModel();
  apply(matTranslate(0, 3, -radius * 1.05));
  ellipsoid(radius * 0.72, 0.32, radius * 0.85, '#6b5424');
  popModel();
  pushModel();
  apply(matTranslate(0, 1.5, radius * 1.55));
  ellipsoid(radius * 1.2, 0.55, radius * 1.05, '#fffdf4');
  popModel();
  for (let i = -1; i <= 1; i++) {
    pushModel();
    apply(matTranslate(0, 2, i * radius * 0.62));
    cube(radius * 2.1, 0.22, 0.32, '#fffdf4');
    popModel();
  }
}

/**
 * A limb hanging from the origin, with a hand, foot, sandal, or sneaker.
 * @param {number} radius
 * @param {number} length
 * @param {string} color
 * @param {string} tip
 * @param {''|'sandal'|'sneaker'} [footwear]
 */
function limb(radius, length, color, tip, footwear) {
  pushModel();
  apply(matTranslate(0, -length * 0.46, 0));
  ellipsoid(radius, length * 0.46, radius * 0.82, color);
  popModel();
  pushModel();
  apply(matTranslate(0, -length + (footwear ? 0.6 : 0), footwear ? 1.5 : 0));
  if (footwear === 'sandal') sandal(radius);
  else if (footwear === 'sneaker') sneaker(radius);
  else ellipsoid(radius * 1.2, radius * 0.95, radius * 1.05, tip);
  popModel();
}

/**
 * Legs and arms for a figure already facing its yaw.
 * @param {object} pose
 */
function drawLimbs(pose) {
  const step = Math.sin(pose.step || 0);
  const lift = pose.hands || 0;
  const crouch = pose.crouch || 0;
  const toss = pose.toss || 0;
  const skin = pose.skin;
  const sleeve = pose.sleeve || skin;
  const footwear = pose.sneakers ? 'sneaker' : (pose.sandals ? 'sandal' : '');
  for (let side = -1; side <= 1; side += 2) {
    pushModel();
    apply(matTranslate(side * pose.hip, pose.hipY, 0));
    const stride = (pose.stride || 0) * (1 - crouch);
    apply(matRotateX(step * side * stride - 0.95 * crouch));
    limb(pose.legR, pose.legLen, skin, skin, footwear);
    popModel();
  }
  for (let side = -1; side <= 1; side += 2) {
    pushModel();
    apply(matTranslate(side * pose.shoulder, pose.shoulderY, 1));
    let z = side * 0.18;
    let x = step * -side * (pose.armSwing || 0);
    z += (side * -0.45 - z) * lift;
    x += (-2.65 - x) * lift;
    z += (side * 0.5 - z) * crouch;
    x += (-2.05 - x) * crouch;
    z += (side * 0.12 - z) * toss;
    x += (-2.7 - x) * toss;
    apply(matRotateZ(z));
    apply(matRotateX(x));
    limb(pose.armR, pose.armLen, sleeve, skin);
    popModel();
  }
}

/**
 * A pacing or airborne money-changer.
 * @param {object} merchant
 */
function drawMerchant3d(merchant) {
  const yaw = merchant.yaw != null ? merchant.yaw : (merchant.facing > 0 ? 0.5 : -0.5);
  const duck = merchant.duck || 0;
  const sink = 9 * duck;
  pushModel();
  apply(matTranslate(merchant.x, GROUND, merchant.y));
  footShadow(11, 8);
  apply(matTranslate(0, merchant.h || 0, 0));
  if ((merchant.h || 0) > 1) apply(matRotateZ(merchant.spin));
  else apply(matRotateY(yaw));
  if (duck > 0.001) apply(matRotateX(0.4 * duck));
  pushModel();
  apply(matTranslate(0, 20 - sink, 0));
  ellipsoid(11, 12, 9, merchant.color);
  popModel();
  pushModel();
  apply(matTranslate(0, 40 - sink, 1));
  ellipsoid(7, 8, 7, '#f3c7a8');
  popModel();
  pushModel();
  apply(matTranslate(0, 44 - sink, -1));
  ellipsoid(7.4, 5, 7.2, '#3a2a22');
  popModel();
  pushModel();
  apply(matTranslate(0, 18 - sink, 7));
  ellipsoid(3.2, 2.2, 2.2, '#e2b44a');
  popModel();
  drawLimbs({
    step: merchant.phase * 1.35,
    hands: 0,
    crouch: duck,
    skin: '#f3c7a8',
    sleeve: merchant.color,
    hip: 4.6,
    hipY: 14 - 5 * duck,
    legR: 2.8,
    legLen: 12,
    shoulder: 11,
    shoulderY: 32 - 8 * duck,
    armR: 2.2,
    armLen: 20,
    stride: 0.4 * (1 - duck),
    armSwing: 0.35 * (1 - duck),
    reach: 0,
  });
  popModel();
}

/**
 * A thin gold ring lying flat above the head, like an angel's halo.
 * @param {number} radius
 * @param {number} pulse
 */
function haloRing(radius, pulse) {
  const tube = 0.58 + pulse * 0.08;
  const major = 48;
  const minor = 8;
  const rgbv = [1, 0.76 + pulse * 0.18, 0.2 + pulse * 0.12];
  /**
   * One point on the ring.
   * @param {number} i
   * @param {number} j
   * @returns {number[]}
   */
  function point(i, j) {
    const u = (i / major) * Math.PI * 2;
    const v = (j / minor) * Math.PI * 2;
    const ring = radius + Math.cos(v) * tube;
    return [Math.cos(u) * ring, Math.sin(v) * tube, Math.sin(u) * ring];
  }
  unlit = true;
  for (let i = 0; i < major; i++) {
    for (let j = 0; j < minor; j++) {
      const a = point(i, j);
      const b = point(i + 1, j);
      const c = point(i + 1, j + 1);
      const d = point(i, j + 1);
      emitSmooth(a, a, rgbv);
      emitSmooth(b, b, rgbv);
      emitSmooth(c, c, rgbv);
      emitSmooth(a, a, rgbv);
      emitSmooth(c, c, rgbv);
      emitSmooth(d, d, rgbv);
    }
  }
  unlit = false;
}

/**
 * Shoulder-length hair down the back, and a short beard.
 */
function drawHairAndBeard() {
  pushModel();
  apply(matTranslate(0, 46.2, -1.8));
  ellipsoid(7.0, 3.3, 5.6, '#4a3428');
  popModel();
  pushModel();
  apply(matTranslate(0, 36, -4.0));
  ellipsoid(6.2, 11, 2.8, '#3d2b22');
  popModel();
  for (let side = -1; side <= 1; side += 2) {
    pushModel();
    apply(matTranslate(side * 4.4, 36, -2.8));
    ellipsoid(3.2, 10, 2.4, '#4a3428');
    popModel();
    pushModel();
    apply(matTranslate(side * 4.8, 37.5, 4.2));
    ellipsoid(1.6, 5.2, 1.8, '#4a3428');
    popModel();
  }
  pushModel();
  apply(matTranslate(0, 36.2, 6.2));
  ellipsoid(3.2, 2.4, 1.8, '#4a3428');
  popModel();
}

/**
 * A narrow white robe, sandals, long hair, a beard, and a halo overhead.
 */
function drawPlayer3d() {
  const p = game.player;
  const gait = p.gait || 0;
  const wob = Math.sin(p.bob);
  const toss = p.toss || 0;
  const haloPulse = 0.5 + 0.5 * Math.sin(performance.now() / 360);
  pushModel();
  apply(matTranslate(p.x, GROUND + Math.abs(wob) * (0.4 + 1.8 * gait), p.y));
  apply(matScale(1.32, 1.32, 1.32));
  footShadow(5.5, 4);
  apply(matRotateY(p.yaw));
  apply(matRotateZ(wob * (0.02 + 0.06 * gait)));
  apply(matRotateX(0.2 * toss));
  pushModel();
  apply(matTranslate(0, 20, 0));
  taper(6.6, 3.8, 24, 16, '#f6f3ec');
  popModel();
  pushModel();
  apply(matTranslate(0, 18, 0.4));
  taper(4.6, 4.2, 2.2, 14, '#e2b44a');
  popModel();
  pushModel();
  apply(matTranslate(0, 33, 0.4));
  ellipsoid(2.1, 2.2, 2, '#f3c7a8');
  popModel();
  pushModel();
  apply(matTranslate(0, 41, 1));
  ellipsoid(6.2, 7, 6, '#f3c7a8');
  popModel();
  drawHairAndBeard();
  pushModel();
  apply(matTranslate(0, 52.5, 0));
  apply(matScale(1 + haloPulse * 0.035, 1, 1 + haloPulse * 0.035));
  haloRing(7.2, haloPulse);
  popModel();
  drawLimbs({
    step: p.bob,
    hands: 0,
    skin: '#f3c7a8',
    sleeve: '#f7f4ee',
    hip: 2.2,
    hipY: 12,
    legR: 1.45,
    legLen: 11,
    shoulder: 7,
    shoulderY: 30,
    armR: 1.7,
    armLen: 16,
    stride: 0.08 + 0.62 * gait,
    armSwing: 0.05 + 0.45 * gait,
    toss: toss,
    sandals: !p.sneakers,
    sneakers: !!p.sneakers,
  });
  popModel();
}

/**
 * A coin or scroll in the air.
 * @param {object} particle
 */
function drawParticle3d(particle) {
  pushModel();
  apply(matTranslate(particle.x, GROUND + particle.h, particle.y));
  apply(matRotateY(particle.rot));
  apply(matRotateX(particle.rot * 0.6));
  if (particle.kind === 'coin') prism(5, 2.4, 8, '#f0c14a');
  else cube(8, 12, 2.2, '#f3e6c8');
  popModel();
}

/**
 * Hovering sneaker and rotating light rays for the speed pickup.
 */
function drawSneakerPickup3d() {
  const pickup = game.sneaker;
  if (!pickup || pickup.delay > 0) return;
  const now = performance.now();
  const pulse = 0.5 + 0.5 * Math.sin(now / 180);
  const spin = now / 900;
  for (let i = 0; i < 12; i++) {
    pushModel();
    apply(matTranslate(pickup.x, GROUND + 1.2, pickup.y));
    apply(matRotateY(spin + i * Math.PI / 6));
    apply(matTranslate(0, 0, 24 + pulse * 5));
    cube(2.2 + pulse, 0.8, 36 + pulse * 8, i % 2 ? '#ffe890' : '#f4c934');
    popModel();
  }
  pushModel();
  apply(matTranslate(pickup.x, GROUND + 3, pickup.y));
  haloRing(24 + pulse * 3, pulse);
  popModel();
  pushModel();
  apply(matTranslate(pickup.x, GROUND + 19 + pulse * 3, pickup.y));
  apply(matRotateY(Math.PI / 2 + Math.sin(now / 700) * 0.32));
  apply(matRotateZ(-0.18));
  apply(matScale(4, 4, 4));
  sneaker(1.5);
  popModel();
}

/**
 * Gold frame on the floor around the table Space or E will hit.
 */
function drawHighlight3d() {
  if (game.mode !== 'play') return;
  const table = nearestUpright(game.player.x, game.player.y, KEY_RANGE);
  if (!table) return;
  const color = game.banner > FLIP_LOCK ? '#b89a58' : '#ffe08a';
  const hw = table.w / 2 + 12;
  const hd = 28;
  const y = GROUND + 1.4;
  pushModel();
  apply(matTranslate(table.x, y, table.y - hd));
  cube(hw * 2, 1.6, 3, color);
  popModel();
  pushModel();
  apply(matTranslate(table.x, y, table.y + hd));
  cube(hw * 2, 1.6, 3, color);
  popModel();
  pushModel();
  apply(matTranslate(table.x - hw, y, table.y));
  cube(3, 1.6, hd * 2, color);
  popModel();
  pushModel();
  apply(matTranslate(table.x + hw, y, table.y));
  cube(3, 1.6, hd * 2, color);
  popModel();
}

/**
 * Build and draw the 3D court.
 */
function drawScene() {
  if (!gl || glFailed) return;
  updateCamera();
  scratch.length = 0;
  model = ident();
  modelStack.length = 0;
  gl.viewport(0, 0, view.width, view.height);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  drawScenery();
  drawCourt3d();
  for (let i = 0; i < game.tables.length; i++) drawTable3d(game.tables[i]);
  for (let i = 0; i < game.merchants.length; i++) drawMerchant3d(game.merchants[i]);
  drawSneakerPickup3d();
  if (game.player) drawPlayer3d();
  for (let i = 0; i < game.particles.length; i++) drawParticle3d(game.particles[i]);
  drawHighlight3d();
  flushMesh();
}

/**
 * Soft screen-space aura around the halo.
 */
function drawHaloGlow() {
  if (!game.player || !cam) return;
  const p = game.player;
  const gait = p.gait || 0;
  const bob = Math.sin(p.bob);
  const lift = Math.abs(bob) * (0.4 + 1.8 * gait);
  const pt = projectToScreen(p.x, GROUND + lift + 52.5 * 1.32, p.y);
  if (!pt) return;
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 360);
  const radius = 24 + pulse * 8;
  const glow = ctx.createRadialGradient(pt.x, pt.y, 3, pt.x, pt.y, radius);
  glow.addColorStop(0, 'rgba(255, 244, 124, ' + (0.28 + pulse * 0.18) + ')');
  glow.addColorStop(0.38, 'rgba(255, 220, 66, ' + (0.18 + pulse * 0.12) + ')');
  glow.addColorStop(1, 'rgba(255, 204, 40, 0)');
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/**
 * Pulsing aura and expiry readout around the speed sneaker.
 */
function drawSneakerGlow() {
  const pickup = game.sneaker;
  if (!pickup || pickup.delay > 0 || !cam) return;
  const pt = projectToScreen(pickup.x, GROUND + 21, pickup.y);
  if (!pt) return;
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 180);
  const radius = 42 + pulse * 13;
  const glow = ctx.createRadialGradient(pt.x, pt.y, 4, pt.x, pt.y, radius);
  glow.addColorStop(0, 'rgba(255, 248, 132, 0.6)');
  glow.addColorStop(0.42, 'rgba(255, 217, 48, 0.3)');
  glow.addColorStop(1, 'rgba(255, 198, 20, 0)');
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  label('SPEED UP  ' + Math.max(0, pickup.time).toFixed(1), pt.x, pt.y - 48, '700 12px ' + FONT, '#fff3a4', 'center', 'middle');
}

/**
 * Arcade reward burst shown after the sneaker is collected.
 */
function drawSpeedFlash() {
  if (game.speedFlash <= 0) return;
  const age = SPEED_FLASH_TIME - game.speedFlash;
  let alpha = Math.min(1, age / 0.08);
  if (game.speedFlash < 0.35) alpha *= game.speedFlash / 0.35;
  const punch = age < 0.22 ? 1.42 - age / 0.22 * 0.42 : 1;
  const cx = W / 2;
  const cy = H * 0.42;

  if (age < 0.12) {
    ctx.save();
    ctx.globalAlpha = (1 - age / 0.12) * 0.7;
    ctx.fillStyle = '#fff5a6';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy);
  ctx.scale(punch, punch);
  ctx.strokeStyle = '#f5ca38';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  for (let i = 0; i < 7; i++) {
    const y = -50 + i * 17;
    const reach = 110 + (i % 3) * 28;
    ctx.beginPath();
    ctx.moveTo(-115, y);
    ctx.lineTo(-115 - reach, y - 8);
    ctx.moveTo(115, y);
    ctx.lineTo(115 + reach, y - 8);
    ctx.stroke();
  }
  ctx.shadowColor = '#ffd83d';
  ctx.shadowBlur = 22;
  ctx.font = '700 58px ' + NUM;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 8;
  ctx.strokeStyle = 'rgba(54, 25, 8, 0.88)';
  ctx.strokeText('SUPER SPEED!', 0, -4);
  ctx.fillStyle = '#fff07a';
  ctx.fillText('SUPER SPEED!', 0, -4);
  ctx.shadowBlur = 0;
  trackedLabel('SNEAKERS EQUIPPED', 0, 40, '700 12px ' + FONT, '#fff8de', 2);
  ctx.restore();
}

/**
 * The short "No." said by whoever just lost a table.
 */
function drawBubbles() {
  for (let i = 0; i < game.bubbles.length; i++) {
    const bubble = game.bubbles[i];
    const lift = bubble.merchant ? (bubble.merchant.h || 0) + 78 : 74;
    const pt = projectToScreen(bubble.x, GROUND + lift, bubble.y);
    if (!pt) continue;
    const remain = bubble.life - bubble.age;
    const alpha = remain < 0.2 ? Math.max(0, remain / 0.2) : 1;
    const rise = Math.min(bubble.age, 0.25) * 14;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(clamp(pt.x, 58, W - 58), clamp(pt.y - rise, 94, H - 58));
    ctx.fillStyle = '#fffaf3';
    roundRect(-26, -32, 52, 28, 8);
    ctx.fill();
    ctx.strokeStyle = '#2a1c14';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-6, -4);
    ctx.lineTo(-1, 8);
    ctx.lineTo(5, -4);
    ctx.closePath();
    ctx.fill();
    label('No.', 0, -18, '700 16px ' + FONT, '#2a1c14', 'center', 'middle');
    ctx.restore();
  }
}

/**
 * Draw compact glowing clock medallions above newly flipped tables.
 */
function drawTimeBursts() {
  for (const burst of game.timeBursts) {
    const pt = projectToScreen(burst.x, GROUND + 64, burst.y);
    if (!pt) continue;
    const progress = burst.age / burst.life;
    const alpha = progress > 0.7 ? (1 - progress) / 0.3 : 1;
    const scale = progress < 0.16 ? 0.72 + progress / 0.16 * 0.28 : 1;
    const rise = progress * 38;

    ctx.save();
    ctx.globalAlpha = clamp(alpha, 0, 1);
    ctx.translate(pt.x, pt.y - rise);
    ctx.scale(scale, scale);
    ctx.shadowColor = '#ffe268';
    ctx.shadowBlur = 24;
    ctx.strokeStyle = 'rgba(255, 226, 104, 0.72)';
    ctx.lineWidth = 3;
    for (let ray = 0; ray < 12; ray++) {
      const angle = ray * Math.PI / 6 + burst.age * 1.8;
      ctx.beginPath();
      ctx.moveTo(Math.cos(angle) * 42, Math.sin(angle) * 42);
      ctx.lineTo(Math.cos(angle) * 50, Math.sin(angle) * 50);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(48, 18, 12, 0.93)';
    ctx.beginPath();
    ctx.arc(0, 0, 39, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#e2b44a';
    ctx.stroke();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#fff1c2';
    ctx.beginPath();
    ctx.arc(0, 0, 44, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    drawHudIcon('time', 0, -13);
    label('+' + FLIP_TIME_BONUS.toFixed(1), 0, 14, '700 20px ' + NUM, '#fff8ea', 'center', 'middle');
    ctx.restore();
  }
}

/**
 * Draw the court, then the flat HUD on top.
 */
function draw() {
  drawScene();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawSneakerGlow();
  drawHaloGlow();
  drawBubbles();
  if (glFailed) {
    label('This browser has no WebGL, so the court cannot be drawn.', W / 2, H / 2, '18px ' + FONT, '#fff6e8', 'center', 'middle');
  }
  if (game.mode === 'play') {
    drawHud();
    drawTimeBursts();
    drawBanner();
    drawSpeedFlash();
  } else {
    drawOverlay();
  }
}
/**
 * Match the backing store to the screen so the court stays sharp.
 */
function fitCanvas() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const width = Math.round(W * dpr);
  const height = Math.round(H * dpr);
  if (view.width !== width || view.height !== height || ui.width !== width || ui.height !== height) {
    view.width = width;
    view.height = height;
    ui.width = width;
    ui.height = height;
  }
}

/**
 * Main loop.
 * @param {number} now
 */
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0);
  last = now;
  update(dt);
  draw();
  pumpMusic();
  requestAnimationFrame(frame);
}

game.best = loadBest();
preloadSfx();
game.player = makePlayer();
fitCanvas();
initGL();
updateCamera();
window.addEventListener('resize', fitCanvas);
window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
document.addEventListener('visibilitychange', onVisibilityChange);
window.addEventListener('pagehide', pauseBackgroundAudio);
window.addEventListener('pageshow', function () {
  if (!document.hidden) resumeForegroundAudio();
});
window.addEventListener('blur', function () {
  keys.left = false;
  keys.right = false;
  keys.up = false;
  keys.down = false;
  resetJoystick();
});
joystickElement.addEventListener('pointerdown', onJoystickDown, { passive: false });
joystickElement.addEventListener('pointermove', updateJoystick, { passive: false });
joystickElement.addEventListener('pointerup', function (e) { resetJoystick(e.pointerId); });
joystickElement.addEventListener('pointercancel', function (e) { resetJoystick(e.pointerId); });
joystickElement.addEventListener('lostpointercapture', function (e) { resetJoystick(e.pointerId); });
flipControl.addEventListener('pointerdown', onMobileFlip, { passive: false });
canvas.addEventListener('pointerdown', onCanvasStart, { passive: false });
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
canvas.addEventListener('dragstart', function (e) { e.preventDefault(); });
last = performance.now();
requestAnimationFrame(frame);
</script>
